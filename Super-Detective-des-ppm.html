<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Détective des ppm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one 16:9 "console" stage centred on a dark cabinet; DOM overlays sit on the canvas; touch pad below on small screens. Single dark arcade look by choice. */
:root{
  color-scheme: dark;
  --cab:#14121f;        /* arcade cabinet */
  --cab2:#1f1b30;
  --ink:#f3eedc;        /* warm phosphor white */
  --dim:#a8a3bd;
  --coin:#ffc93c;       /* coin / correct gold */
  --hit:#ff5d6c;        /* damage */
  --ok:#5ee6a0;
  --panel:#262140;
  --line:#3d3663;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
html,body{background:var(--cab);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
header.top h1 span{color:var(--coin)}
header.top p{margin:0;color:var(--dim);font-size:13px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px var(--line),0 18px 50px rgba(0,0,0,.5)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
[hidden]{display:none!important}
.hud{z-index:5}
.ov{z-index:6;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2.5%}
.ov[hidden]{display:none!important}
button{font-family:var(--f-display);cursor:pointer}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.btn{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:4px;padding:8px 14px;font-size:15px;font-weight:600;box-shadow:0 3px 0 #0008}
.btn:hover{border-color:var(--coin)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.gold{background:var(--coin);color:#2a1c00;border-color:#b98a10}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:1.2% 2%;font-family:var(--f-display);font-size:clamp(11px,1.8vw,18px);pointer-events:none;text-shadow:2px 2px 0 #000}
.hud .grp{display:flex;gap:1.6em;align-items:center}
.hud .hearts{color:var(--hit);letter-spacing:.1em}
.hud .pause{pointer-events:auto;font-size:inherit;padding:2px 10px}

/* World select */
.menu{flex-direction:column;gap:2%;justify-content:flex-start;padding-top:3%;overflow:auto}
.menu h2{font-family:var(--f-display);margin:0;font-size:clamp(16px,2.8vw,28px);text-shadow:3px 3px 0 #000;text-align:center}
.menu .sub{margin:0;color:var(--ink);opacity:.85;font-size:clamp(11px,1.5vw,14px);text-align:center;text-shadow:1px 1px 0 #000}
.worlds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.4%;width:100%;margin-top:1%}
.portal{position:relative;background:var(--w-bg);border:3px solid var(--w-edge);border-radius:6px;color:var(--w-ink);text-align:left;padding:8% 8% 10%;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 5px 0 #0009;transition:transform .12s}
.portal:hover,.portal:focus-visible{transform:translateY(-4px)}
.portal .no{font-size:clamp(10px,1.2vw,12px);opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.portal .nm{font-size:clamp(12px,1.75vw,19px);font-weight:700;line-height:1.05}
.portal .mode{font-family:var(--f-body);font-size:clamp(10px,1.2vw,12.5px);line-height:1.25;opacity:.92}
.portal .stars{font-size:clamp(11px,1.6vw,17px);letter-spacing:.12em;margin-top:auto}
.portal canvas{position:relative;width:100%;height:auto;aspect-ratio:4/3;border-radius:3px;image-rendering:pixelated;background:#0003}
.menu .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:1.5%}


/* Carte des mondes */
.mapov{align-items:flex-end;pointer-events:none;padding:2%}
.mapbar{pointer-events:auto;width:100%;background:#14121fe6;border:3px solid var(--line);border-radius:8px;padding:clamp(8px,1.4vw,14px);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mapinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.mapinfo .no{font-family:var(--f-display);color:var(--coin);font-size:clamp(11px,1.4vw,14px);letter-spacing:.06em}
.mapinfo .nm{font-family:var(--f-display);font-size:clamp(15px,2.2vw,22px);font-weight:700}
.mapinfo .ds{font-size:clamp(11px,1.4vw,14px);color:var(--ink);opacity:.9;line-height:1.3}
.mapbtns{display:flex;gap:6px;flex-wrap:wrap}
.mapbtns .btn{font-size:clamp(12px,1.4vw,15px);padding:6px 11px}
@media (max-width:640px){ .mapinfo .ds{display:none} }

/* Quiz */
.card{background:var(--panel);border:3px solid var(--q-edge,var(--coin));border-radius:8px;width:min(720px,100%);max-height:100%;overflow:auto;padding:clamp(12px,2.4vw,24px);box-shadow:0 8px 0 #000a;display:flex;flex-direction:column;gap:12px}
.card .kick{font-family:var(--f-display);color:var(--q-edge,var(--coin));font-size:clamp(11px,1.4vw,14px);letter-spacing:.08em;text-transform:uppercase}
.card .q{font-size:clamp(14px,2vw,20px);line-height:1.35;font-weight:700;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font-family:var(--f-body);font-size:clamp(12.5px,1.6vw,16px);text-align:left;background:var(--cab2);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.3;font-weight:400}
.opt b{font-family:var(--f-display);color:var(--coin);margin-right:6px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:#173b2c}
.opt.wrong{border-color:var(--hit);background:#4a1b26}
.opt[disabled]{cursor:default}
.expl{border-left:4px solid var(--ok);padding:6px 12px;background:#0003;font-size:clamp(12.5px,1.6vw,15.5px);line-height:1.4}
.expl.bad{border-left-color:var(--hit)}
.card .actions{display:flex;justify-content:flex-end;gap:8px}

/* Codex */
.codex{flex-direction:column;justify-content:flex-start;background:#0b0914f2;overflow:auto;gap:10px}
.codex .head{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;flex-wrap:wrap}
.codex h2{font-family:var(--f-display);margin:0;font-size:clamp(16px,2.4vw,24px)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.tab{font-family:var(--f-display);background:var(--cab2);color:var(--dim);border:2px solid var(--line);border-radius:4px;padding:4px 10px;font-size:13px}
.tab[aria-selected="true"]{color:#14121f;background:var(--t-c,var(--coin));border-color:var(--t-c,var(--coin))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:100%}
.note{background:var(--panel);border:2px solid var(--line);border-top:5px solid var(--t-c,var(--coin));border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.42;min-width:0}
.note h3{font-family:var(--f-display);font-size:16px;margin:0 0 4px}
.note p{margin:0}
.note .f{font-family:"Courier New",monospace;background:#0004;padding:1px 5px;border-radius:3px;white-space:nowrap}
.note.locked{opacity:.45;border-top-color:var(--line)}

/* Atelier (analyse technologique) */
.atelier{z-index:4;background:#1b2230;align-items:stretch;justify-content:stretch;padding:0;font-family:var(--f-body)}
.at-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;width:100%;height:100%}
.at-left{position:relative;background:
  linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/24px 24px,#16324f;border-right:3px solid #0d1b2b;min-width:0}
.at-left canvas{position:absolute;inset:0;width:100%;height:100%}
.at-tag{position:absolute;left:10px;top:44px;font-family:var(--f-display);font-size:clamp(10px,1.3vw,13px);color:#bfe3ff;background:#0d1b2bcc;padding:3px 8px;border-radius:3px}
.at-right{display:flex;flex-direction:column;gap:10px;padding:clamp(10px,2vw,20px);padding-top:clamp(40px,6vw,56px);overflow:auto;background:#eae4d3;color:#1e2633;min-width:0}
.at-right h3{font-family:var(--f-display);margin:0;font-size:clamp(14px,2vw,20px);color:#16324f}
.at-right .step{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:#9b5b00;text-transform:uppercase}
.at-right p{margin:0;line-height:1.4;font-size:clamp(12.5px,1.55vw,15px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-body);font-size:clamp(12px,1.45vw,14.5px);background:#fff;color:#1e2633;border:2px solid #b8ad92;border-radius:999px;padding:5px 12px}
.chip:hover{border-color:#16324f}
.chip.on{background:#16324f;color:#fff;border-color:#16324f}
.chip.right{background:#1f7a4d;color:#fff;border-color:#1f7a4d}
.chip.wrong{background:#b5323f;color:#fff;border-color:#b5323f}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.feedback{font-size:clamp(12px,1.5vw,14.5px);padding:6px 10px;border-radius:4px;background:#fff8;border-left:4px solid #1f7a4d;line-height:1.4}
.feedback.bad{border-left-color:#b5323f}
.ratio{font-family:var(--f-display);font-size:clamp(16px,2.4vw,24px);color:#16324f}
.at-right .btn{align-self:flex-start;background:#16324f;color:#fff;border-color:#0d1b2b}

/* Messages / end screens */
.banner{flex-direction:column;gap:12px;text-align:center;background:#000a}
.banner h2{font-family:var(--f-display);font-size:clamp(22px,4.5vw,46px);margin:0;text-shadow:4px 4px 0 #000}
.banner p{margin:0;max-width:52ch;font-size:clamp(13px,1.8vw,17px);line-height:1.4}

/* Touch pad */
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .g{display:flex;gap:10px}
.pad button{width:64px;height:56px;font-size:22px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px}
.pad button.act{width:86px;background:var(--coin);color:#2a1c00;border-color:#b98a10}
.pad button.on{filter:brightness(1.4)}
@media (pointer:coarse){ .pad{display:flex} }
.help{color:var(--dim);font-size:13px;display:flex;gap:18px;flex-wrap:wrap;margin:0}
.help kbd{font-family:var(--f-display);background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;padding:0 6px;color:var(--ink)}

@media (max-width:760px){
  .worlds{grid-template-columns:repeat(3,minmax(0,1fr))}
  .portal .mode{display:none}
  .opts{grid-template-columns:1fr}
  .at-grid{grid-template-columns:1fr;grid-template-rows:42% 58%}
  .at-left{border-right:0;border-bottom:3px solid #0d1b2b}
  .at-right{padding-top:10px}
}
@media (max-width:520px){ .worlds{grid-template-columns:repeat(2,minmax(0,1fr))} .portal canvas{display:none} }
@media (prefers-reduced-motion:reduce){ .portal{transition:none} }

/* Course des ppm */
.rui{flex-direction:column;gap:12px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#3a1f2a,#14121fee 70%);overflow:auto}
.rui h2{font-family:var(--f-display);font-size:clamp(22px,4.4vw,44px);margin:0;text-shadow:3px 3px 0 #000}
.rui h2 em{font-style:normal;color:#ff5d6c}
.rui p{margin:0;max-width:62ch;line-height:1.45;font-size:clamp(13px,1.6vw,16px)}
.rmodes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rmodes .btn{min-width:min(220px,100%)}
.rmodes .btn small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.85;margin-top:3px}
.rhelp{color:var(--dim);font-size:13px!important}
.rhelp kbd{font-family:var(--f-display);background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;padding:0 5px}
.rcode{font-family:var(--f-display);font-size:clamp(34px,7vw,70px);letter-spacing:.18em;color:var(--coin);text-shadow:3px 3px 0 #000}
.rcodein{font-family:var(--f-display);font-size:26px;letter-spacing:.2em;text-transform:uppercase;width:7ch;text-align:center;background:#0b0914;color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:6px}
.rstatus{color:var(--dim);font-size:14px!important;min-height:1.4em}
.rres{display:flex;flex-direction:column;gap:8px;width:min(520px,100%)}
.rres div{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;background:#0006;border-left:6px solid var(--c);border-radius:0 6px 6px 0;padding:8px 14px;text-align:left}
.rres b{font-family:var(--f-display);font-size:18px}
.rres .rt{font-family:var(--f-display);font-size:22px;color:var(--coin)}
.rres span:last-child:not(.rt){width:100%;font-size:13px;color:var(--dim)}
.rpads{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.rpads .g{display:flex;gap:8px}
.rpads button{width:62px;height:56px;font-size:20px;background:var(--panel);color:var(--ink);border:2px solid var(--c);border-radius:10px}
.rpads button.j{width:86px;font-family:var(--f-display);font-size:15px}
.rpads button.on{filter:brightness(1.5)}
.rpads:not(.two) .g[data-p="1"]{display:none}
@media (pointer:coarse){ .rpads:not([hidden]){display:flex} }
</style>
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>Super Détective des <span>ppm</span></h1>
    <p>Science et technologie · 4<sup>e</sup> secondaire · concentrations en ppm · 4 missions de plateformes</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" width="960" height="540" aria-label="Écran de jeu"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="grp"><span id="hudWorld">—</span><span class="hearts" id="hudHearts">♥♥♥</span></div>
      <div class="grp"><span id="hudScore">✦ 0</span><button class="btn pause" id="btnQuit" type="button">Carte</button></div>
    </div>

    <div class="ov mapov" id="menu">
      <div class="mapbar">
        <div class="mapinfo"><span class="no" id="mapNo"></span><span class="nm" id="mapName"></span><span class="ds" id="mapDesc"></span></div>
        <div class="mapbtns">
          <button class="btn" id="mapPrev" type="button" aria-label="Monde précédent">◀</button>
          <button class="btn gold" id="mapPlay" type="button">Jouer ▸</button>
          <button class="btn" id="mapNext" type="button" aria-label="Monde suivant">▶</button>
          <button class="btn" id="btnCodex" type="button">Carnet de notions</button>
          <button class="btn" id="btnSound" type="button">Son : activé</button>
        </div>
      </div>
    </div>
    <div class="ov" id="quiz" hidden><div class="card" id="quizCard"></div></div>
    <div class="ov codex" id="codex" hidden></div>
    <div class="ov atelier" id="atelier" hidden></div>
    <div class="ov banner" id="banner" hidden></div>
    <div class="ov rui" id="raceUI" hidden></div>
  </div>

  <div class="rpads" id="racePads" hidden>
    <div class="g" data-p="0" style="--c:#5ee6c8"><button type="button" data-k="l" aria-label="Joueur 1 gauche">◀</button><button type="button" data-k="r" aria-label="Joueur 1 droite">▶</button><button type="button" class="j" data-k="j" aria-label="Joueur 1 sauter">SAUT</button></div>
    <div class="g" data-p="1" style="--c:#ff7a59"><button type="button" class="j" data-k="j" aria-label="Joueur 2 sauter">SAUT</button><button type="button" data-k="l" aria-label="Joueur 2 gauche">◀</button><button type="button" data-k="r" aria-label="Joueur 2 droite">▶</button></div>
  </div>
  <div class="pad" id="pad">
    <div class="g"><button type="button" data-k="left" aria-label="Gauche">◀</button><button type="button" data-k="right" aria-label="Droite">▶</button></div>
    <div class="g"><button type="button" data-k="up" aria-label="Haut">▲</button><button type="button" data-k="down" aria-label="Bas">▼</button><button type="button" class="act" data-k="fire" aria-label="Lancer" style="width:64px;background:#5ee6a0;border-color:#2aa86d">TIR</button><button type="button" class="act" data-k="jump" aria-label="Saut">SAUT</button></div>
  </div>

  <p class="help"><span><kbd>←</kbd> <kbd>→</kbd> bouger</span><span><kbd>Espace</kbd> / <kbd>↑</kbd> sauter</span><span><kbd>X</kbd> lancer une fiole (pouvoir Neutralisant)</span><span><kbd>1</kbd>–<kbd>4</kbd> répondre</span><span><kbd>Échap</kbd> retour à la carte</span></p>
</div>
<script>
// ================= SUPER DÉTECTIVE DES PPM : DONNÉES =================
const WORLDS = [
  {id:"lab",    no:"Monde 1", name:"Labo du compte-gouttes", col:"#5ee6c8"},
  {id:"turbo",  no:"Monde 2", name:"Tuyauterie turbo",       col:"#ffc93c"},
  {id:"riv",    no:"Monde 3", name:"Rivière aux Castors",    col:"#b48cff"},
  {id:"bassin", no:"Monde 4", name:"Bassin de traitement",   col:"#ff7a59"}
];
const CODEX = {
  lab:[
    {id:"cmv", t:"C = m ÷ V", h:"Concentration = masse de soluté ÷ volume de solution. On isole : <span class='f'>m = C × V</span> et <span class='f'>V = m ÷ C</span>. Pour des ppm dans l'eau : m en mg, V en L."},
    {id:"unites", t:"Unités de volume et de masse", h:"<span class='f'>1 L = 1000 mL</span> · <span class='f'>1 g = 1000 mg</span>. Convertis les mL en L avant de diviser : 250 mL = 0,25 L."},
    {id:"dilution", t:"Dilution", h:"Ajouter de l'eau augmente le volume sans changer la masse de soluté : la concentration diminue. Doubler le volume → concentration ÷ 2."}
  ],
  turbo:[
    {id:"ppmL", t:"1 ppm = 1 mg/L", h:"ppm = parties par million. 1 L d'eau ≈ 1 000 000 mg, donc 1 mg dans 1 L = 1 ppm."},
    {id:"gL", t:"g/L ↔ ppm", h:"<span class='f'>1 g/L = 1000 mg/L = 1000 ppm</span>. g/L → ppm : × 1000. ppm → g/L : ÷ 1000."},
    {id:"pct", t:"% ↔ ppm", h:"<span class='f'>1 % = 1 g/100 mL = 10 000 ppm</span>. % → ppm : × 10 000. ppm → % : ÷ 10 000."},
    {id:"solide", t:"ppm dans un solide", h:"Dans un sol ou un aliment : <span class='f'>1 ppm = 1 mg/kg</span>."}
  ],
  riv:[
    {id:"riviere", t:"Analyser un échantillon", h:"1. Convertis le volume en L. 2. Calcule <span class='f'>C = m ÷ V</span>. 3. Compare à la norme : au-dessus, l'eau n'est pas conforme."},
    {id:"source", t:"Trouver la source", h:"Une hausse brusque de concentration entre deux stations indique une source entre elles. Un affluent d'eau propre dilue la rivière en aval."}
  ],
  bassin:[
    {id:"norme", t:"Comparer à une norme", h:"Mets d'abord toutes les mesures dans la même unité (ppm), puis compare. Ex. : 0,015 g/L = 15 ppm, donc plus que 10 ppm."},
    {id:"echelle", t:"Imaginer 1 ppm", h:"1 ppm ≈ une goutte (0,05 mL) dans 50 L d'eau, ou 1 seconde dans 11,6 jours."}
  ]
};
const MAPINFO = {
  lab:"Calcule des masses, des volumes et des concentrations (C = m ÷ V). Boss : le Bécher débordant.",
  turbo:"Enchaîne les conversions : mg/L, g/L, %, mg/kg. Les rangées de blocs-réponses t'attendent ! Boss : la Vanne folle.",
  riv:"Touche les 4 stations d'échantillonnage, calcule leurs ppm et trouve la source de la contamination. Boss : le Grand Déversement.",
  bassin:"Écrase seulement les contaminants au-dessus de la norme. Épargner les autres, c'est éviter les fausses alertes ! Boss : le Super-Contaminant."
};

// ---------- utilitaires ----------
const pk = a => a[Math.floor(Math.random()*a.length)];
const cl = n => Number(Number(n).toPrecision(10));
const nf = n => cl(n).toLocaleString("fr-CA", {maximumFractionDigits:4});
const vol = L => L < 1 ? `${nf(L*1000)} mL` : `${nf(L)} L`;
const dec = (n, d) => Math.abs(n*Math.pow(10,d) - Math.round(n*Math.pow(10,d))) < 1e-9;
function mkQ(q, ans, wrongs, unit, e, c){
  const f = v => typeof v === "number" ? `${nf(v)}${unit ? " " + unit : ""}` : v;
  const o = [f(ans)];
  for (const w of wrongs){ if (typeof w === "number" && (!(w > 0) || !isFinite(w))) continue; const t = f(w); if (!o.includes(t)) o.push(t); if (o.length === 4) break; }
  let k = 2; while (o.length < 4 && typeof ans === "number"){ const t = f(cl(ans*k*1.5)); if (!o.includes(t)) o.push(t); k++; }
  return {q, o, a:0, e, c};
}
// raw : {q, s (version courte), ans, wr, u, e, c}
const RAW = {
  C:() => { let mg, mL, C; do { mg = pk([0.5,1,1.5,2,2.5,3,4,5,6,8,9,12]); mL = pk([100,200,250,500]); C = mg/(mL/1000); } while (!dec(C,2)); return {q:`On dissout ${nf(mg)} mg de soluté pour obtenir ${mL} mL de solution aqueuse. Quelle est la concentration en ppm ?`, s:`${nf(mg)} mg dans ${mL} mL = ? ppm`, ans:C, wr:[mg*mL/1000, C*1000, C/10, mg/mL], u:"ppm", e:`${mL} mL = ${nf(mL/1000)} L. C = ${nf(mg)} mg ÷ ${nf(mL/1000)} L = ${nf(C)} mg/L = ${nf(C)} ppm.`, c:"cmv"}; },
  m:() => { let C, V, m; do { C = pk([2,4,5,6,8,10,12,15,20,25,40]); V = pk([0.1,0.2,0.25,0.5,1.5,2,3]); m = C*V; } while (!dec(m,2)); return {q:`Quelle masse de soluté faut-il pour préparer ${vol(V)} d'une solution à ${C} ppm ?`, s:`${vol(V)} à ${C} ppm : masse ?`, ans:cl(m), wr:[C/V, m*1000, m*10, C+V], u:"mg", e:`m = C × V = ${C} mg/L × ${nf(V)} L = ${nf(m)} mg.`, c:"cmv"}; },
  V:() => { let C, m, V; do { C = pk([2,4,5,8,10,20,25]); m = pk([1,2,4,5,10,20,40,50]); V = m/C; } while (!dec(V,2) || V > 20); return {q:`Avec ${m} mg de soluté, quel volume de solution peut-on préparer pour obtenir une concentration de ${C} ppm ?`, s:`${m} mg pour ${C} ppm : volume ?`, ans:cl(V), wr:[m*C, V*1000, C/m, V*10], u:"L", e:`V = m ÷ C = ${m} mg ÷ ${C} mg/L = ${nf(V)} L.`, c:"cmv"}; },
  gL:() => { let g, mL, C; do { g = pk([2,3,4,5,6,9,12,15]); mL = pk([100,200,250,500]); C = g/(mL/1000); } while (!dec(C,2)); return {q:`On dissout ${g} g de sel pour obtenir ${mL} mL de solution. Quelle est la concentration en g/L ?`, s:`${g} g dans ${mL} mL = ? g/L`, ans:C, wr:[g/mL, C/1000, C*1000, g*mL/1000], u:"g/L", e:`${mL} mL = ${nf(mL/1000)} L. C = ${g} g ÷ ${nf(mL/1000)} L = ${nf(C)} g/L.`, c:"unites"}; },
  dil:() => { const C = pk([12,20,30,40,60,90,120]), k = pk([2,3,4]), w = {2:"doubler",3:"tripler",4:"quadrupler"}[k]; return {q:`Une solution à ${C} ppm est diluée : on ajoute de l'eau jusqu'à ${w} son volume. Quelle est la nouvelle concentration ?`, s:`${C} ppm, volume ×${k} : ?`, ans:cl(C/k), wr:[C*k, C, C-k], u:"ppm", e:`La masse de soluté ne change pas et le volume est multiplié par ${k} : ${C} ÷ ${k} = ${nf(C/k)} ppm.`, c:"dilution"}; },
  mgL:() => { const x = pk([0.5,2,7.5,12,40,0.08,3.2]); return {q:`Dans l'eau, ${nf(x)} mg/L correspond à combien de ppm ?`, s:`${nf(x)} mg/L = ? ppm`, ans:x, wr:[x*1000, x/1000, x*10], u:"ppm", e:`Dans l'eau, 1 mg/L = 1 ppm : ${nf(x)} mg/L = ${nf(x)} ppm.`, c:"ppmL"}; },
  g2p:() => { const x = pk([0.002,0.015,0.2,1.5,0.05,0.008,0.03]); return {q:`Convertis ${nf(x)} g/L en ppm.`, s:`${nf(x)} g/L = ? ppm`, ans:cl(x*1000), wr:[x*100, x*10000, x*1e6, x], u:"ppm", e:`1 g/L = 1000 ppm : ${nf(x)} × 1000 = ${nf(x*1000)} ppm.`, c:"gL"}; },
  p2g:() => { const x = pk([250,40,3000,8,600,75]); return {q:`Convertis ${nf(x)} ppm en g/L.`, s:`${nf(x)} ppm = ? g/L`, ans:cl(x/1000), wr:[x/100, x/10000, x*1000], u:"g/L", e:`On divise par 1000 : ${nf(x)} ppm = ${nf(x)} mg/L = ${nf(x/1000)} g/L.`, c:"gL"}; },
  pc2p:() => { const x = pk([0.1,0.002,1,0.05,2.5,0.4,0.0005]); return {q:`Convertis ${nf(x)} % en ppm.`, s:`${nf(x)} % = ? ppm`, ans:cl(x*10000), wr:[x*1000, x*100, x*100000], u:"ppm", e:`1 % = 10 000 ppm : ${nf(x)} × 10 000 = ${nf(x*10000)} ppm.`, c:"pct"}; },
  p2pc:() => { const x = pk([5000,200,30000,50,1500,8]); return {q:`Convertis ${nf(x)} ppm en %.`, s:`${nf(x)} ppm = ? %`, ans:cl(x/10000), wr:[x/1000, x/100, x/100000], u:"%", e:`On divise par 10 000 : ${nf(x)} ppm = ${nf(x/10000)} %.`, c:"pct"}; },
  sol:() => { const [mg, kg] = pk([[4,2],[12,3],[0.8,0.4],[30,5],[1.5,0.5],[9,4.5]]); const a = mg/kg; return {q:`Un échantillon de sol de ${nf(kg)} kg contient ${nf(mg)} mg de plomb. Quelle est la concentration en ppm ?`, s:`${nf(mg)} mg / ${nf(kg)} kg = ? ppm`, ans:cl(a), wr:[a*1000, mg*kg, a/1000], u:"ppm", e:`Dans un solide, 1 ppm = 1 mg/kg : ${nf(mg)} mg ÷ ${nf(kg)} kg = ${nf(a)} ppm.`, c:"solide"}; }
};
const POOLS = { lab:["C","m","V","gL","dil","C","m"], turbo:["mgL","g2p","p2g","pc2p","p2pc","sol","g2p","pc2p"], riv:["C","dil","g2p","C","mgL"] };
function genQ(wid){ const r = RAW[pk(POOLS[wid] || POOLS.lab)](); return mkQ(r.q, r.ans, r.wr, r.u, r.e, r.c); }
function genQuick(wid){
  const r = RAW[pk(POOLS[wid] || POOLS.lab)]();
  const f = v => `${nf(v)} ${r.u}`, o = [f(r.ans)];
  for (const w of r.wr){ if (!(w > 0) || !isFinite(w)) continue; const t = f(cl(w)); if (!o.includes(t)) o.push(t); if (o.length === 3) break; }
  while (o.length < 3) o.push(f(cl(r.ans*(o.length+1)*3)));
  const order = shuffle([0,1,2]);
  return {q:r.s, o:order.map(i => o[i]), a:order.indexOf(0), e:r.e, c:r.c};
}

const VIEWS = {
  ppm: v => ({label:`${nf(v)} ppm`, conv:`${nf(v)} ppm`}),
  mgL: v => ({label:`${nf(v)} mg/L`, conv:`${nf(v)} mg/L = ${nf(v)} ppm`}),
  gL:  v => ({label:`${nf(v/1000)} g/L`, conv:`${nf(v/1000)} g/L × 1000 = ${nf(v)} ppm`}),
  pct: v => ({label:`${nf(v/10000)} %`, conv:`${nf(v/10000)} % × 10 000 = ${nf(v)} ppm`}),
  mv:  v => { const mL = pk([100,200,250,500]); const mg = cl(v*mL/1000); return {label:`${nf(mg)} mg/${mL} mL`, conv:`${nf(mg)} mg ÷ ${nf(mL/1000)} L = ${nf(v)} ppm`}; }
};
const viewOf = v => VIEWS[pk(["ppm","mgL","gL","gL","pct","mv","mv"])](v);
function normQuick(N){
  const above = cl(N * pk([1.5,2,3,4])), below = shuffle([cl(N*0.2), cl(N*0.5), cl(N*0.8), cl(N*0.1)]).slice(0,2);
  const vals = shuffle([above, ...below]), views = vals.map(viewOf);
  return {q:`Lequel dépasse ${N} ppm ?`, o:views.map(v => v.label), a:vals.indexOf(above), e:views.map(v => v.conv).join(" · "), c:"norme"};
}
function normQ(N){
  const above = cl(N * pk([1.5,2,3,4])), below = shuffle([cl(N*0.2), cl(N*0.5), cl(N*0.8), cl(N*0.1)]).slice(0,3);
  const views = [above, ...below].map(viewOf);
  return {q:`La norme est de ${N} ppm. Laquelle de ces mesures la dépasse ?`, o:views.map(v => v.label), a:0, e:views.map(v => v.conv).join(" · ") + `. Seule la première est au-dessus de ${N} ppm.`.replace("la première", views[0].label), c:"norme"};
}

// ---------- Audio : petit séquenceur chiptune ----------
const AudioSys = (() => {
  let ac = null, master = null, timer = null, step = 0, nextT = 0, song = null;
  const NOTES = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
  const freq = n => { const m = n.match(/^([A-G]#?)(\d)$/); if(!m) return 0; return 440*Math.pow(2,(NOTES[m[1]] + (+m[2]+1)*12 - 69)/12); };
  const parse = s => s.trim().split(/\s+/);
  function ensure(){
    if (ac) return true;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return false; }
    master = ac.createGain(); master.gain.value = SAVE.sound ? 0.18 : 0; master.connect(ac.destination);
    return true;
  }
  function tone(f, t, dur, type, vol, slideTo){
    if (!f) return;
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    o.connect(v); v.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  let noiseBuf = null;
  function noise(t, dur, vol, hp){
    if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate*0.3, ac.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
    s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp;
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    s.connect(f); f.connect(v); v.connect(master); s.start(t); s.stop(t+dur+0.02);
  }
  function tick(){
    if (!song) return;
    const spb = 60 / song.bpm / 2; // croches
    while (nextT < ac.currentTime + 0.12){
      const i = step % song.lead.length;
      const L = song.lead[i], B = song.bass[step % song.bass.length];
      let len = 1; while (song.lead[(i+len) % song.lead.length] === "-" && len < 8) len++;
      if (L !== "." && L !== "-") tone(freq(L), nextT, spb*len*0.9, song.wave, 0.22);
      if (B !== "." && B !== "-") tone(freq(B), nextT, spb*1.6, "triangle", 0.35);
      if (song.drum){ const d = song.drum[step % song.drum.length]; if (d==="k") tone(150, nextT, 0.12, "sine", 0.5, 45); else if (d==="h") noise(nextT, 0.04, 0.12, 7000); else if (d==="s") noise(nextT, 0.12, 0.25, 1500); }
      nextT += spb; step++;
    }
  }
  return {
    unlock(){ if (ensure() && ac.state === "suspended") ac.resume(); },
    play(name){
      if (!ensure()) return;
      const S = SONGS[name]; if (!S) return;
      song = {bpm:S.bpm, wave:S.wave, lead:parse(S.lead), bass:parse(S.bass), drum:S.drum ? parse(S.drum) : null};
      step = 0; nextT = ac.currentTime + 0.05;
      if (!timer) timer = setInterval(tick, 40);
    },
    stop(){ song = null; },
    setOn(on){ SAVE.sound = on; persist(); if (master) master.gain.value = on ? 0.18 : 0; },
    sfx(kind){
      if (!ac || !SAVE.sound) return; const t = ac.currentTime;
      if (kind==="jump") tone(320, t, 0.14, "square", 0.18, 640);
      else if (kind==="coin"){ tone(988, t, 0.07, "square", 0.2); tone(1319, t+0.07, 0.22, "square", 0.2); }
      else if (kind==="good"){ [523,659,784,1047].forEach((f,i)=>tone(f, t+i*0.07, 0.16, "square", 0.18)); }
      else if (kind==="bad"){ tone(300, t, 0.18, "sawtooth", 0.2, 120); tone(200, t+0.16, 0.3, "sawtooth", 0.2, 80); }
      else if (kind==="hit"){ noise(t, 0.18, 0.4, 500); tone(180, t, 0.2, "square", 0.2, 60); }
      else if (kind==="stomp"){ tone(500, t, 0.1, "square", 0.2, 150); }
      else if (kind==="bump"){ tone(140, t, 0.08, "square", 0.25, 90); }
      else if (kind==="win"){ [523,659,784,659,784,1047].forEach((f,i)=>tone(f, t+i*0.12, 0.2, "square", 0.2)); }
      else if (kind==="click"){ noise(t, 0.03, 0.2, 3000); }
    }
  };
})();

// ---------- Utilitaires de dessin ----------
function wrapText(text, x, y, maxW, lh, align){
  const words = text.split(" "); let line = "", lines = [];
  for (const w of words){ const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  g.textAlign = align || "left";
  lines.forEach((l,i) => g.fillText(l, x, y + i*lh));
  return lines.length;
}
function px(x,y,w,h,c){ g.fillStyle = c; g.fillRect(Math.round(x),Math.round(y),w,h); }
function font(sz, fam){ g.font = (fam==="b" ? `700 ${sz}px "Atkinson Hyperlegible", sans-serif` : `700 ${sz}px "Pixelify Sans", monospace`); }

// Héros scientifique dessiné en blocs (lunettes de labo, sarrau)
function drawHero(x, y, face, t, opt){
  opt = opt || {};
  const s = opt.s || 3; const f = face < 0 ? -1 : 1;
  g.save(); g.translate(Math.round(x), Math.round(y)); g.scale(f, 1);
  const P = (cx,cy,w,h,c) => { g.fillStyle = c; g.fillRect((cx-6)*s, cy*s, w*s, h*s); };
  const run = opt.run ? Math.floor(t*12)%2 : 0;
  if (opt.blink && Math.floor(t*20)%2) { g.restore(); return; }
  P(3,0,6,2,"#4a2b1a");               // cheveux
  P(2,2,8,5,"#f2c79a");               // visage
  P(2,2,1,3,"#4a2b1a");
  P(3,3,6,2,"#1a1424"); P(4,3,1,1,"#8fd3ff"); P(7,3,1,1,"#8fd3ff"); // lunettes
  P(1,7,10,6,opt.coat||"#ffffff");    // sarrau
  P(5,7,2,6,"#3a5bd9");               // chandail
  P(0,8,2,4,"#f2c79a");               // main arrière
  P(10,8,2,3,"#f2c79a");
  if (opt.air){ P(2,13,3,2,"#2d3561"); P(7,12,3,2,"#2d3561"); P(1,15,3,1,"#1a1424"); P(8,14,3,1,"#1a1424"); }
  else if (run){ P(2,13,3,2,"#2d3561"); P(7,13,3,1,"#2d3561"); P(1,15,4,1,"#1a1424"); P(8,14,3,1,"#1a1424"); }
  else { P(2,13,3,2,"#2d3561"); P(7,13,3,2,"#2d3561"); P(2,15,3,1,"#1a1424"); P(7,15,3,1,"#1a1424"); }
  g.restore();
}

  const w = worldById(worldId);
  const order = shuffle(q.o.map((t,i)=>({t,i})));
  quizState = {q, order, done, answered:false, worldId};
  const card = $("quizCard");
  card.style.setProperty("--q-edge", w.col);
  card.innerHTML = `<div class="kick">${opts.kicker || w.name}</div><p class="q">${q.q}</p>
    <div class="opts">${order.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><b>${k+1}</b>${o.t}</button>`).join("")}</div>
    <div id="qExpl"></div><div class="actions" id="qAct"></div>`;
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
  $("quiz").hidden = false; paused = true;
  card.querySelector(".opt").focus({preventScroll:true});
}
function answer(k){
  const s = quizState; if (!s || s.answered) return;
  s.answered = true;
  const ok = s.order[k].i === s.q.a;
  const btns = $("quizCard").querySelectorAll(".opt");
  btns.forEach((b,j) => { b.disabled = true; if (s.order[j].i === s.q.a) b.classList.add("right"); else if (j===k) b.classList.add("wrong"); });
  if (ok){ AudioSys.sfx("good"); unlockCard(s.q.c); } else AudioSys.sfx("bad");
  $("qExpl").innerHTML = `<div class="expl ${ok?"":"bad"}"><b>${ok ? "Bonne réponse !" : "Pas tout à fait."}</b> ${s.q.e}</div>`;
  $("qAct").innerHTML = `<button type="button" class="btn gold" id="qGo">Continuer ▸</button>`;
  $("qGo").addEventListener("click", closeQuiz); $("qGo").focus({preventScroll:true});
  s.ok = ok;
}
function closeQuiz(){
  const s = quizState; if (!s || !s.answered) return;
  $("quiz").hidden = true; paused = false; quizState = null;
  for (const k in keys) keys[k] = false;
  s.done(s.ok);
}
function quizKey(e){
  if (!quizState) return;
  if (!quizState.answered && /^Digit[1-4]$/.test(e.code)){ const n = +e.code.slice(5)-1; if (n < quizState.order.length) answer(n); }
  else if (quizState.answered && (e.code==="Enter" || e.code==="Space")){ e.preventDefault(); closeQuiz(); }
}

let scene = null, paused = false, last = performance.now(), T = 0;

function loop(now){
  const dt = Math.min(1/30, (now - last)/1000); last = now;
  if (scene){
    if (!paused){ T += dt; scene.update && scene.update(dt); }
    scene.draw && scene.draw(dt);
  }
  requestAnimationFrame(loop);
}

// ---------- construction ----------
function buildLevel(wid){
  const list = [{rows:SEG_START}];
  const commons = shuffle(SEG_COMMON);
  if (wid === "riv"){
    const mid = commons.slice(0, 5);
    list.push({rows:mid[0]}, {rows:SEG_STATION, st:0}, {rows:mid[1]}, {rows:SEG_STATION, st:1}, {rows:mid[2]}, {rows:SEG_ANSWER}, {rows:SEG_STATION, st:2}, {rows:mid[3]}, {rows:SEG_STATION, st:3}, {rows:mid[4]});
  } else {
    const nA = wid === "turbo" ? 4 : 2, nC = wid === "turbo" ? 4 : 6;
    shuffle(commons.slice(0, nC).map(r => ({rows:r})).concat(Array.from({length:nA}, () => ({rows:SEG_ANSWER})))).forEach(s => list.push(s));
  }
  list.push({rows:SEG_GATE, gate:true}, {rows:SEG_ARENA, arena:true});
  const map = []; for (let r=0;r<14;r++) map.push([]);
  const spawns = [], coins = [], groups = [], stations = []; let gateCol = -1, arenaCol = -1;
  for (const seg of list){
    const w = Math.max(...seg.rows.map(r => r.length)), c0 = map[0].length;
    if (seg.gate) gateCol = c0; if (seg.arena) arenaCol = c0;
    const rows = Array(4).fill(" ".repeat(w)).concat(seg.rows.map(r => r.padEnd(w, " ")));
    let grp = null;
    rows.forEach((row, r) => { for (let i=0;i<w;i++){
      let ch = row[i];
      if ("ef".includes(ch)){ spawns.push({type:ch, c:c0+i, r}); ch = " "; }
      else if (ch === "o"){ coins.push({x:(c0+i)*40+20, y:r*40+20, on:true}); ch = " "; }
      else if (ch === "A"){ if (!grp){ grp = {runs:[], r, done:false}; groups.push(grp); } const last = grp.runs[grp.runs.length-1]; if (last && last.c1 === c0+i-1) last.c1 = c0+i; else grp.runs.push({c0:c0+i, c1:c0+i}); }
      else if (ch === "S"){ stations.push({c:c0+i, r, idx:seg.st, done:false}); ch = " "; }
      map[r].push(ch);
    }});
  }
  return {map, COLS:map[0].length, spawns, coins, groups, stations, gateCol, arenaCol, landmarks:[]};
}

// ---------- scénario de la rivière ----------
function riverScenario(){
  const SC = pk([
    {cont:"nitrates", des:"des nitrates", src:"Ferme", kind:"ferme", why:"les engrais et le fumier lessivés par la pluie rejoignent la rivière"},
    {cont:"cuivre", des:"du cuivre", src:"Ancienne mine", kind:"mine", why:"l'eau qui ruisselle sur les résidus miniers rejoint la rivière"},
    {cont:"hydrocarbures", des:"des hydrocarbures", src:"Garage", kind:"garage", why:"les fuites d'huile et d'essence entraînées par la pluie rejoignent la rivière"},
    {cont:"phosphates", des:"des phosphates", src:"Usine de détergents", kind:"usine", why:"les eaux de lavage de l'usine sont rejetées dans la rivière"}
  ]);
  const DECOY = pk([{n:"Parc municipal"},{n:"Érablière"},{n:"Camping"}]);
  const NORM = pk([5,10,20]), seg = pk([0,1]), r1 = v => cl(Math.round(v*10)/10);
  const low = r1(NORM*pk([0.1,0.2,0.3])), high = r1(NORM*pk([1.6,1.8,2,2.4]));
  const ppm = seg === 0 ? [low, high, r1(high*pk([0.95,1])), 0] : [low, r1(low*pk([1.2,1.5])), high, 0];
  ppm[3] = r1(ppm[2]*pk([0.6,0.65,0.7])); if (ppm[3] <= NORM) ppm[3] = r1(NORM*1.2);
  const V = shuffle([0.1,0.2,0.25,0.5,1]).slice(0,4);
  const S = ["A","B","C","D"].map((id,i) => ({id, ppm:ppm[i], V:V[i], mg:cl(ppm[i]*V[i])}));
  const sites = seg === 0 ? [{n:SC.src, kind:SC.kind}, {n:DECOY.n, kind:"parc"}] : [{n:DECOY.n, kind:"parc"}, {n:SC.src, kind:SC.kind}];
  const stQ = S.map(s => mkQ(`Station ${s.id} : ${vol(s.V)} d'eau contiennent ${nf(s.mg)} mg ${SC.des}. Quelle est la concentration ?`, s.ppm, [s.mg*s.V, s.ppm*1000, cl(s.mg/(s.V*1000)), s.ppm*10], "ppm", `${vol(s.V)} = ${nf(s.V)} L. C = ${nf(s.mg)} mg ÷ ${nf(s.V)} L = ${nf(s.ppm)} ppm : ${s.ppm > NORM ? "dépasse" : "respecte"} la norme de ${NORM} ppm.`, "riviere"));
  const over = S.filter(x => x.ppm > NORM).map(x => x.id);
  const ovTxt = over.length === 3 ? "B, C et D" : over.length === 2 ? "C et D" : over.length === 1 ? "Seulement " + over[0] : "Aucune";
  const OV = shuffle(["C et D","B, C et D","Seulement C","Aucune","Seulement D"].filter(t => t !== ovTxt)).slice(0,3);
  const DIL = "Le ruisseau Clair ajoute de l'eau : la même masse de contaminant se répartit dans un plus grand volume";
  const bossQ = [
    {q:`Quelles stations dépassent la norme de ${NORM} ppm ?`, o:[ovTxt, ...OV], a:0, e:`${S.map(x => `${x.id} : ${nf(x.ppm)} ppm`).join(" · ")}. La norme est de ${NORM} ppm.`, c:"riviere"},
    {q:`Où se trouve la source probable ${SC.des} ?`, o:[`${sites[seg].n}, entre ${seg === 0 ? "A et B" : "B et C"}`, `${sites[1-seg].n}, entre ${seg === 0 ? "B et C" : "A et B"}`, "Le ruisseau Clair, entre C et D", "Avant la station A"], a:0, e:`La concentration fait un bond entre ${seg === 0 ? "A et B" : "B et C"} : c'est là que ${SC.why}.`, c:"source"},
    {q:"Pourquoi la concentration baisse-t-elle entre C et D, même sans nouvelle source ?", o:[DIL, "Le contaminant disparaît dans l'eau", "L'eau devient plus chaude", "Les poissons filtrent le contaminant"], a:0, e:"C'est une dilution : C = m ÷ V. Le volume augmente, la masse reste presque la même, donc C diminue.", c:"source"}
  ];
  return {SC, NORM, S, sites, stQ, bossQ};
}

function MarioWorld(wid){
  const TH = THEMES[wid], TS = 40, ROWS = 14;
  const L = buildLevel(wid), map = L.map, COLS = L.COLS;
  const SOLID = "#B?X=PTAGR";
  const tile = (c,r) => (c<0||c>=COLS) ? "#" : (r<0||r>=ROWS) ? " " : map[r][c];
  const solid = ch => SOLID.includes(ch);
  const solidPx = (x, y) => solid(tile(Math.floor(x/TS), Math.floor(y/TS)));

  const NORM = wid === "bassin" ? pk([5,10,20]) : 0;
  const RS = wid === "riv" ? riverScenario() : null;
  if (RS){
    const stX = i => (L.stations.find(s => s.idx === i).c) * TS;
    L.landmarks.push({...RS.sites[0], name:RS.sites[0].n, x:(stX(0)+stX(1))/2}, {...RS.sites[1], name:RS.sites[1].n, x:(stX(1)+stX(2))/2}, {kind:"ruisseau", name:"Ruisseau Clair (eau propre)", x:(stX(2)+stX(3))/2});
  }
  const qOf = () => wid === "bassin" ? normQ(NORM) : genQ(wid);
  const qAt = {}; for (let c=0;c<COLS;c++) for (let r=0;r<ROWS;r++) if (map[r][c] === "?") qAt[c+"_"+r] = qOf();
  L.groups.forEach(G => G.q = wid === "bassin" ? normQuick(NORM) : genQuick(wid));
  const bossQs = RS ? RS.bossQ : [];

  const mkFoe = (s, i) => {
    const e = {type:s.type, x:s.c*TS + 4, y:(s.r+1)*TS - 30, x0:s.c*TS + 4, y0:s.r*TS + 6, w:32, h:30, vx:(i%2 ? 60 : -60), alive:true, sq:0, v:i, ph:i*1.7};
    if (wid === "bassin"){ const up = i % 2 === 0; e.ppm = up ? cl(NORM*pk([1.2,1.5,2,3,4])) : cl(NORM*pk([0.1,0.2,0.4,0.5,0.8])); const vw = viewOf(e.ppm); e.lbl = vw.label; e.conv = vw.conv; }
    return e;
  };
  const enemies = L.spawns.map(mkFoe);
  const coins = L.coins;
  const p = {x:2*TS, y:9*TS, w:24, h:46, vx:0, vy:0, on:false, face:1, inv:0, tier:0, safeX:2*TS, prevB:0};
  let cam = 0, hearts = 3, nCoins = 0, score = 0, right = 0, asked = 0, falseA = 0, done = false, msg = null;
  let bumps = [], pops = [], items = [], flasks = [], bproj = [], debris = [];
  let locked = false, boss = null, flag = null, bossQi = 0;
  const arenaX = L.arenaCol * TS, gateX = L.gateCol * TS;
  const TIERS = ["", "Bouclier", "Neutralisant (X)"];

  function say(txt, t){ msg = {txt, t: t || 3}; }
  function hud2(){ setHud(`${TH.short} · ${wid === "bassin" ? "Norme : " + NORM + " ppm" : wid === "riv" ? "Norme : " + RS.NORM + " ppm" : TH.name}${p.tier ? " · " + TIERS[p.tier] : ""}`, hearts, 5, `${nCoins} · ${score} pts`); $("hudHearts").textContent = "♥".repeat(hearts) + "♡".repeat(Math.max(0, 5 - hearts)); }

  function collideX(){
    const top = Math.floor(p.y/TS), bot = Math.floor((p.y+p.h-1)/TS);
    if (p.vx > 0){ const c = Math.floor((p.x+p.w)/TS); for (let r=top;r<=bot;r++) if (solid(tile(c,r))){ p.x = c*TS - p.w - 0.01; p.vx = 0; } }
    else if (p.vx < 0){ const c = Math.floor(p.x/TS); for (let r=top;r<=bot;r++) if (solid(tile(c,r))){ p.x = (c+1)*TS + 0.01; p.vx = 0; } }
  }
  function collideY(){
    const l = Math.floor(p.x/TS), rr = Math.floor((p.x+p.w-1)/TS);
    p.on = false;
    if (p.vy >= 0){
      const r = Math.floor((p.y+p.h)/TS);
      for (let c=l;c<=rr;c++){ const ch = tile(c,r); if (solid(ch) || (ch === "-" && p.prevB <= r*TS + 1)){ p.y = r*TS - p.h; p.vy = 0; p.on = true; if (tile(Math.floor((p.x+p.w/2)/TS), r) === "#") p.safeX = p.x; } }
    } else {
      const r = Math.floor(p.y/TS); let hitC = -1, best = 1e9;
      for (let c=l;c<=rr;c++) if (solid(tile(c,r))){ const d = Math.abs((c*TS+20)-(p.x+p.w/2)); if (d<best){ best=d; hitC=c; } }
      if (hitC >= 0){ p.y = (r+1)*TS; p.vy = 0; hitBlock(hitC, r); }
    }
  }
  function spawnItem(c, r){ items.push({x:c*TS+20, y:r*TS+10, base:r*TS, rise:0.5, vx:110, vy:0}); }
  function hitBlock(c, r){
    const ch = tile(c,r); bumps.push({c, r, t:0.18});
    if (ch === "?"){
      map[r][c] = "X"; asked++; AudioSys.sfx("coin");
      setTimeout(() => ask(wid, qAt[c+"_"+r], ok => {
        if (ok){ right++; score += 200; nCoins++; spawnItem(c, r); pops.push({x:c*TS+20, y:r*TS-10, t:1, txt:"+200"}); } else pops.push({x:c*TS+20, y:r*TS-10, t:1, txt:"✗"});
      }, {kicker:`Bloc ? · ${TH.name}`}), 120);
    } else if (ch === "A"){
      const G = L.groups.find(G => G.r === r && G.runs.some(u => c >= u.c0 && c <= u.c1)); if (!G || G.done) return;
      const k = G.runs.findIndex(u => c >= u.c0 && c <= u.c1); G.done = true; asked++;
      G.runs.forEach((u, i) => { for (let cc=u.c0; cc<=u.c1; cc++) map[r][cc] = i === G.q.a ? "G" : (i === k ? "R" : "X"); });

    }
  }
  for (const co of P.coins) if (co.on && Math.abs(co.x - (P.x+P.w/2)) < 22 && Math.abs(co.y - (P.y+P.h/2)) < 30){ co.on = false; P.nCoins++; AudioSys.sfx("coin"); }
  if (P.x > RACE.R.flagX){ P.fin = true; AudioSys.sfx("win"); if (RACE.mode === "online") rSend({t:"fin", tm:P.time, r:P.right, w:P.wrong}); }
}

// ---------- dessin d'une vue ----------
function rBackdrop(cam, vw){
  g.fillStyle = "#1d3c5c"; g.fillRect(0, 0, vw, 560);
  const o1 = -(cam*0.2) % 48; g.fillStyle = "#24476b"; for (let x=o1;x<vw;x+=48) g.fillRect(x,0,2,560); for (let y=0;y<560;y+=48) g.fillRect(0,y,vw,2);
  const o2 = -(cam*0.45);
  for (let i=0;i<120;i++){ const sx = o2 + i*260; if (sx < -260 || sx > vw) continue; px(sx, 150, 200, 8, "#5b3b22");
    const cols = ["#ff5d6c","#5ee6a0","#ffc93c","#c08bff"]; for (let k=0;k<4;k++){ const bx = sx+16+k*46; px(bx+6,100,16,50,"#cfe7f5"); px(bx+9,120,10,30,cols[(i+k)%4]); } }
}
function rDrawWorld(P, others, vw){
  const R = RACE.R, cam = P.cam, TH = THEMES.lab, GR = TH.ground;
  rBackdrop(cam, vw);
  g.save(); g.translate(-cam, 0);
  const c0 = Math.max(0, Math.floor(cam/40)), c1 = Math.min(R.COLS-1, c0 + Math.ceil(vw/40) + 1);
  for (let c=c0;c<=c1;c++){
    if (P.map[12][c] === " " && P.map[13][c] === " ") px(c*40, 500, 40, 60, TH.gap);
    for (let r=0;r<14;r++){ const ch = P.map[r][c]; if (ch === " ") continue; const x = c*40, y = r*40;
      if (ch === "#"){ px(x,y,40,40,GR[1]); if (!rSolid(rTile(P,c,r-1))){ px(x,y,40,8,GR[0]); px(x,y+8,40,3,GR[2]); } }
      else if (ch === "B"){ px(x,y,40,40,TH.brick[0]); px(x+2,y+2,36,36,TH.brick[1]); px(x,y+19,40,2,TH.brick[0]); px(x+19,y,2,19,TH.brick[0]); }
      else if (ch === "=" || ch === "P"){ px(x,y,40,40,TH.block[0]); px(x+3,y+3,34,34,TH.block[1]); }
      else if (ch === "-"){ px(x, y, 40, 10, TH.plank); }
      else if ("AGRX".includes(ch)){ const col = ch === "G" ? ["#1f7a4d","#5ee6a0"] : ch === "R" ? ["#7a1f2a","#ff5d6c"] : ch === "X" ? ["#2e2640","#4a4060"] : ["#0d4a5a","#5ee6c8"]; px(x,y,40,40,col[0]); px(x, y+2, 40, 36, col[1]); }
    } }
  // lettres des blocs-réponses
  R.groups.forEach((G, gi) => { G.runs.forEach((u, i) => { const ux = u.c0*40, uw = (u.c1-u.c0+1)*40; if (ux + uw < cam - 40 || ux > cam + vw + 40) return;
    g.fillStyle = P.done[gi] >= 0 && i !== G.q.a ? "#ffffff88" : "#08202a"; font(28); g.textAlign = "center"; g.fillText("ABC"[i], ux + uw/2, G.r*40 + 31); }); });
  for (const co of P.coins){ if (!co.on || co.x < cam - 20 || co.x > cam + vw + 20) continue; g.fillStyle = "#ffc93c"; g.beginPath(); g.ellipse(co.x, co.y, 9*Math.abs(Math.cos(T*4 + co.x)) + 1, 13, 0, 0, 7); g.fill(); }
  for (const e of P.en){ if (e.alive && e.x > cam - 60 && e.x < cam + vw + 60) drawFoe(e, e.x, e.y, TH); }
  // drapeau
  const fx = R.flagX; px(fx+18, 120, 6, 360, "#e8eef2"); for (let r=0;r<4;r++) for (let c=0;c<6;c++) px(fx+24+c*10, 124+r*10, 10, 10, (r+c)%2 ? "#1a1424" : "#ffffff"); g.fillStyle = "#fff"; font(16); g.textAlign = "center"; g.fillText("ARRIVÉE", fx + 50, 112);
  // autres coureurs (fantômes)
  for (const o of others){ g.globalAlpha = 0.45; drawHero(o.x + 12, o.y - 2, o.face, T, {run:!o.fin, coat:RACE_COL[o.idx]}); g.globalAlpha = 1; g.fillStyle = RACE_COL[o.idx]; font(13); g.textAlign = "center"; g.fillText(o.label, o.x + 12, o.y - 10); }
  if (P.boost > 0){ for (let i=1;i<4;i++){ g.globalAlpha = 0.18*(4-i); drawHero(P.x + 12 - P.face*i*14, P.y - 2, P.face, T, {run:true, coat:RACE_COL[P.idx]}); } g.globalAlpha = 1; }
  drawHero(P.x + 12, P.y - 2, P.face, T, {run: Math.abs(P.vx) > 20 && P.on, air: !P.on, blink: P.stun > 0, coat:RACE_COL[P.idx]});
  if (P.stun > 0 && !P.fin){ g.fillStyle = "#ffc93c"; font(18); g.textAlign = "center"; for (let i=0;i<3;i++){ const a = T*6 + i*2.1; g.fillText("✦", P.x + 12 + Math.cos(a)*18, P.y - 8 + Math.sin(a)*6); } }
  g.restore();
}
function rNextGroup(P){ const R = RACE.R; let best = -1; R.groups.forEach((G, gi) => { const x1 = (G.runs[G.runs.length-1].c1 + 1)*40; if (P.done[gi] < 0 && x1 > P.x - 10 && (best < 0 || G.runs[0].c0 < R.groups[best].runs[0].c0)) best = gi; }); return best; }
function rView(P, others, vx, vy, vw, vh, s, label){
  const ww = vw/s; // largeur du monde visible
  P.cam += ((P.x - ww*0.35) - P.cam) * 0.15; P.cam = clamp(P.cam, 0, RACE.R.COLS*40 - ww);
  g.save(); g.beginPath(); g.rect(vx, vy, vw, vh); g.clip(); g.translate(vx, vy); g.scale(s, s);
  rDrawWorld(P, others, ww);
  g.restore();
  // bandeau question (en coordonnées écran, toujours lisible)
  g.save(); g.beginPath(); g.rect(vx, vy, vw, vh); g.clip();
  const gi = rNextGroup(P), bh = 54;
  g.fillStyle = "#000c"; g.fillRect(vx, vy, vw, bh); g.fillStyle = RACE_COL[P.idx]; g.fillRect(vx, vy + bh - 3, vw, 3);
  g.textAlign = "left"; g.fillStyle = RACE_COL[P.idx]; font(15); g.fillText(label, vx + 10, vy + 20);
  g.fillStyle = "#fff"; font(18); g.textAlign = "right"; g.fillText(fmtT(P.time), vx + vw - 10, vy + 22);
  g.font = `700 13px "Atkinson Hyperlegible", sans-serif`; g.fillStyle = "#ffc93c"; g.fillText(`✓ ${P.right}  ✗ ${P.wrong}`, vx + vw - 10, vy + 42);
  g.textAlign = "left";
  if (P.fb){ g.fillStyle = P.fb.ok ? "#5ee6a0" : "#ff5d6c"; g.font = `700 15px "Atkinson Hyperlegible", sans-serif`; g.fillText(P.fb.h, vx + 130, vy + 20); g.fillStyle = "#e8eef2"; g.font = `400 13px "Atkinson Hyperlegible", sans-serif`; const t = P.fb.e.length > 95 ? P.fb.e.slice(0, 93) + "…" : P.fb.e; g.fillText(t, vx + 10, vy + 42); }
  else if (gi >= 0 && !P.fin){ const G = RACE.R.groups[gi]; g.fillStyle = "#fff"; g.font = `700 16px "Atkinson Hyperlegible", sans-serif`; g.fillText(G.q.q, vx + 130, vy + 20);
    g.font = `700 14px "Atkinson Hyperlegible", sans-serif`; let xx = vx + 10; G.q.o.forEach((o, i) => { g.fillStyle = "#5ee6c8"; g.fillText("ABC"[i] + " :", xx, vy + 42); g.fillStyle = "#f4efe0"; g.fillText(o, xx + 26, vy + 42); xx += 30 + g.measureText(o).width + 22; }); }
  else if (P.fin){ g.fillStyle = "#5ee6a0"; g.font = `700 16px "Atkinson Hyperlegible", sans-serif`; g.fillText("Arrivé ! En attente des autres…", vx + 130, vy + 20); }
  // progression
  const R = RACE.R, px0 = vx + 20, pw = vw - 40, py = vy + vh - 16;
  g.fillStyle = "#000a"; g.fillRect(px0 - 6, py - 8, pw + 12, 16); g.fillStyle = "#ffffff33"; g.fillRect(px0, py - 2, pw, 4);
  const dot = (x, col) => { g.fillStyle = col; g.beginPath(); g.arc(px0 + pw*clamp(x/R.flagX, 0, 1), py, 6, 0, 7); g.fill(); };
  others.forEach(o => dot(o.x, RACE_COL[o.idx])); dot(P.x, RACE_COL[P.idx]);
  g.fillStyle = "#fff"; g.fillRect(px0 + pw - 2, py - 8, 4, 16);
  g.restore();
}

// ---------- scène ----------
const RaceScene = {
  world:"race",
  enter(){},
  update(dt){
    if (RACE.over) return;
    if (RACE.count > 0){ const before = Math.ceil(RACE.count); RACE.count -= dt; const now = Math.ceil(RACE.count); if (now !== before) AudioSys.sfx(now <= 0 ? "good" : "click"); RACE.p.forEach(P => P.inp.jp = false); return; }
    RACE.p.forEach(P => rStep(P, dt));
    if (RACE.mode === "online"){ RACE.sendT -= dt; if (RACE.sendT <= 0){ RACE.sendT = 0.07; const P = RACE.p[0]; rSend({t:"st", x:P.x, y:P.y, f:P.face, fin:P.fin, tm:P.time}); } }
    const meDone = RACE.p.every(P => P.fin), oppDone = RACE.mode !== "online" || (RACE.ghost && RACE.ghost.fin);
    if (meDone && !oppDone){ RACE.endT += dt; }
    if ((meDone && oppDone) || (meDone && RACE.endT > 45)) raceResults();
  },
  draw(){
    if (!RACE.p) return;
    if (RACE.n === 2){
      rView(RACE.p[0], [{...RACE.p[1], label:"J2"}], 0, 0, W, H/2 - 2, 0.5, "JOUEUR 1");
      rView(RACE.p[1], [{...RACE.p[0], label:"J1"}], 0, H/2 + 2, W, H/2 - 2, 0.5, "JOUEUR 2");
      g.fillStyle = "#14121f"; g.fillRect(0, H/2 - 2, W, 4);
    } else {
      const others = RACE.ghost ? [{...RACE.ghost, idx:1, label:"Adversaire"}] : [];
      rView(RACE.p[0], others, 0, 0, W, H, 1, RACE.mode === "online" ? "TOI" : "CONTRE LA MONTRE");
    }
    if (RACE.count > 0){ const n = Math.ceil(RACE.count); g.fillStyle = "#000a"; g.fillRect(W/2 - 110, H/2 - 60, 220, 120); g.fillStyle = n <= 0 ? "#5ee6a0" : "#ffc93c"; font(76); g.textAlign = "center"; g.fillText(n > 3 ? "Prêts ?" : n <= 0 ? "GO !" : String(n), W/2, H/2 + 26); }
  }
};

// ---------- résultats ----------
function raceResults(){
  RACE.over = true; AudioSys.stop(); AudioSys.sfx("win");
  let rows = [], title;
  if (RACE.mode === "solo"){
    const P = RACE.p[0], best = SAVE.raceBest, rec = !best || P.time < best; if (rec){ SAVE.raceBest = P.time; persist(); }
    title = rec ? "Nouveau record !" : "Course terminée";
    rows = [{n:"Toi", c:RACE_COL[0], t:P.time, r:P.right, w:P.wrong}];
    rows.push({n:"Record", c:"#ffc93c", t:SAVE.raceBest, r:null});
  } else if (RACE.mode === "local"){
    rows = RACE.p.map((P, i) => ({n:`Joueur ${i+1}`, c:RACE_COL[i], t:P.time, r:P.right, w:P.wrong}));
    const w = rows[0].t <= rows[1].t ? 0 : 1; title = `Joueur ${w+1} gagne !`;
  } else {
    const P = RACE.p[0], G = RACE.ghost;
    rows = [{n:"Toi", c:RACE_COL[0], t:P.time, r:P.right, w:P.wrong}, {n:"Adversaire", c:RACE_COL[1], t:G.fin ? G.time : null, r:G.right, w:G.wrong}];
    title = !G.fin || G.time == null || P.time <= G.time ? "Tu as gagné !" : "Tu as perdu…";
  }
  const sorted = rows.slice().sort((a,b) => (a.t ?? 1e9) - (b.t ?? 1e9));
  const html = `<h2>${title}</h2><div class="rres">${sorted.map((r,i) => `<div style="--c:${r.c}"><b>${r.n === "Record" ? "★" : (i+1) + "."} ${r.n}</b><span class="rt">${r.t != null ? fmtT(r.t) : "pas arrivé"}</span>${r.r != null ? `<span>Bons blocs : ${r.r} · fausses manips : ${r.w}</span>` : ""}</div>`).join("")}</div>
    <p>Chaque bonne réponse donne un turbo de 3 s, chaque erreur coûte 1,5 s.</p>
    <div class="rmodes"><button class="btn gold" id="rAgain" type="button">${RACE.mode === "online" ? (RACE.role === "host" ? "Nouvelle course" : "Demander une revanche") : "Nouvelle course"}</button><button class="btn" id="rMap" type="button">Retour à la carte</button></div><p class="rstatus" id="rStatus"></p>`;
  raceUI("results", html);
  $("rAgain").onclick = () => {
    if (RACE.mode === "online"){ if (RACE.role === "host") raceHostGo(); else { rSend({t:"again"}); rStatus("Demande envoyée…"); } }
    else startRace(RACE.mode, (Math.random()*1e9)|0);
  };
  $("rMap").onclick = () => quitToMenu();
}

// ---------- réseau ----------
const RPeer = location.hash === "#bctest" ? RaceFakePeer() : (typeof Peer !== "undefined" ? Peer : null);
const RPREFIX = "course-ppm-st4-";
function rSend(m){ try { if (RACE.conn && RACE.conn.open !== false) RACE.conn.send(m); } catch(e){} }
function raceNetClose(){ try { RACE.conn && RACE.conn.close(); } catch(e){} try { RACE.peer && RACE.peer.destroy(); } catch(e){} RACE.conn = null; RACE.peer = null; RACE.role = null; clearTimeout(RACE.to); }
function raceHost(){
  if (!RPeer) return;
  $("rOnChoice").hidden = true; $("rHostBox").hidden = false;
  const tryHost = () => {
    const code = Array.from({length:4}, () => "ABCDEFGHJKMNPQRSTUVWXYZ"[Math.floor(Math.random()*23)]).join("");
    rStatus("Création de la course…");
    const peer = new RPeer(RPREFIX + code.toLowerCase()); RACE.peer = peer; RACE.role = "host";
    peer.on("open", () => { $("rCode").textContent = code; rStatus("En attente de ton adversaire… Il choisit « Rejoindre une course » et tape ce code."); });
    peer.on("error", err => { if (err && err.type === "unavailable-id"){ try { peer.destroy(); } catch(e){} tryHost(); } else rStatus("Erreur réseau (" + (err && err.type || "inconnue") + "). Vérifie la connexion Internet."); });
    peer.on("connection", conn => { if (RACE.conn) return; RACE.conn = conn; conn.on("data", raceData); conn.on("close", raceLost); conn.on("open", () => { rStatus("Adversaire connecté !"); setTimeout(raceHostGo, 400); }); });
  };
  tryHost();
}
function raceHostGo(){ const seed = (Math.random()*1e9)|0; rSend({t:"go", seed}); startRace("online", seed); }
function raceJoin(){
  if (!RPeer) return;
  const code = $("rCodeIn").value.trim().toUpperCase(); if (code.length !== 4){ rStatus("Le code contient 4 lettres."); return; }
  rStatus("Connexion à la course " + code + "…");
  const peer = new RPeer(); RACE.peer = peer; RACE.role = "guest";
  peer.on("error", err => rStatus(err && err.type === "peer-unavailable" ? "Aucune course avec ce code. Vérifie le code." : "Erreur réseau (" + (err && err.type || "inconnue") + ")."));
  peer.on("open", () => { const conn = peer.connect(RPREFIX + code.toLowerCase(), {reliable:true, serialization:"json"}); RACE.conn = conn; conn.on("data", raceData); conn.on("close", raceLost); conn.on("open", () => rStatus("Connecté ! La course va commencer…")); });
  clearTimeout(RACE.to); RACE.to = setTimeout(() => { if (scene !== RaceScene) rStatus("La connexion prend du temps. Le réseau de l'école bloque peut-être les connexions entre appareils : essaie le partage de connexion d'un cellulaire."); }, 12000);
}
function raceData(d){
  if (!d || !d.t) return;
  if (d.t === "go"){ clearTimeout(RACE.to); startRace("online", d.seed); }
  else if (d.t === "st" && RACE.ghost){ Object.assign(RACE.ghost, {x:d.x, y:d.y, face:d.f, fin:d.fin || RACE.ghost.fin, time:d.tm}); }
  else if (d.t === "fin" && RACE.ghost){ Object.assign(RACE.ghost, {fin:true, time:d.tm, right:d.r, wrong:d.w}); }
  else if (d.t === "again" && RACE.role === "host" && RACE.over) raceHostGo();
}
function raceLost(){ if (!RACE.active) return; const wasRacing = scene === RaceScene && !RACE.over; raceNetClose(); if (wasRacing && RACE.ghost){ RACE.ghost.fin = true; RACE.ghost.time = null; } if (!wasRacing){ raceUI("online"); rStatus("La connexion avec l'adversaire a été perdue."); } }
function RaceFakePeer(){
  const bc = new BroadcastChannel("course-fakepeer");
  class Ev { constructor(){ this.h = {}; } on(e, f){ (this.h[e] = this.h[e] || []).push(f); } emit(e, a){ (this.h[e] || []).forEach(f => f(a)); } }
  class FConn extends Ev { constructor(peer, rid){ super(); this.peer = peer; this.rid = rid; this.open = false; } send(d){ bc.postMessage({to:this.rid, from:this.peer.id, type:"data", data:d}); } close(){ bc.postMessage({to:this.rid, from:this.peer.id, type:"close"}); } }
  return class FPeer extends Ev {
    constructor(id){ super(); this.id = id || "g" + Math.random().toString(36).slice(2,8); this.c = {}; bc.addEventListener("message", ev => this.msg(ev.data)); setTimeout(() => this.emit("open", this.id), 30); }
    connect(rid){ const c = new FConn(this, rid); this.c[rid] = c; bc.postMessage({to:rid, from:this.id, type:"connect"}); return c; }
    msg(m){ if (m.to !== this.id) return; const c = this.c[m.from];
      if (m.type === "connect"){ const n = new FConn(this, m.from); this.c[m.from] = n; this.emit("connection", n); setTimeout(() => { n.open = true; n.emit("open"); bc.postMessage({to:m.from, from:this.id, type:"accept"}); }, 20); }
      else if (m.type === "accept" && c){ c.open = true; c.emit("open"); } else if (m.type === "data" && c) c.emit("data", m.data); else if (m.type === "close" && c) c.emit("close"); }
    destroy(){}
  };
}

// nettoyage quand on revient à la carte
const _quitToMenu = quitToMenu;
quitToMenu = function(){ if (RACE.active){ RACE.active = false; RACE.p = null; raceNetClose(); $("raceUI").hidden = true; $("racePads").hidden = true; $("pad").hidden = false; } _quitToMenu(); };
// ================= DÉMARRAGE =================
$("btnCodex").addEventListener("click", () => openCodex());
const sb = $("btnSound");
const syncSound = () => sb.textContent = "Son : " + (SAVE.sound ? "activé" : "coupé");
sb.addEventListener("click", () => { AudioSys.unlock(); AudioSys.setOn(!SAVE.sound); syncSound(); if (SAVE.sound && scene === MenuScene) AudioSys.play("menu"); });
syncSound();
go(MenuScene);
requestAnimationFrame(loop);
</script>
