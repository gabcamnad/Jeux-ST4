<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Odyssée ST 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one 16:9 "console" stage centred on a dark cabinet; DOM overlays sit on the canvas; touch pad below on small screens. Single dark arcade look by choice. */
:root{
  color-scheme: dark;
  --cab:#14121f;        /* arcade cabinet */
  --cab2:#1f1b30;
  --ink:#f3eedc;        /* warm phosphor white */
  --dim:#a8a3bd;
  --coin:#ffc93c;       /* coin / correct gold */
  --hit:#ff5d6c;        /* damage */
  --ok:#5ee6a0;
  --panel:#262140;
  --line:#3d3663;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
html,body{background:var(--cab);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,34px);margin:0;letter-spacing:.02em;text-wrap:balance}
header.top h1 span{color:var(--coin)}
header.top p{margin:0;color:var(--dim);font-size:13px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px var(--line),0 18px 50px rgba(0,0,0,.5)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
[hidden]{display:none!important}
.hud{z-index:5}
.ov{z-index:6;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2.5%}
.ov[hidden]{display:none!important}
button{font-family:var(--f-display);cursor:pointer}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.btn{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:4px;padding:8px 14px;font-size:15px;font-weight:600;box-shadow:0 3px 0 #0008}
.btn:hover{border-color:var(--coin)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.gold{background:var(--coin);color:#2a1c00;border-color:#b98a10}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:1.2% 2%;font-family:var(--f-display);font-size:clamp(11px,1.8vw,18px);pointer-events:none;text-shadow:2px 2px 0 #000}
.hud .grp{display:flex;gap:1.6em;align-items:center}
.hud .hearts{color:var(--hit);letter-spacing:.1em}
.hud .pause{pointer-events:auto;font-size:inherit;padding:2px 10px}

/* World select */
.menu{flex-direction:column;gap:2%;justify-content:flex-start;padding-top:3%;overflow:auto}
.menu h2{font-family:var(--f-display);margin:0;font-size:clamp(16px,2.8vw,28px);text-shadow:3px 3px 0 #000;text-align:center}
.menu .sub{margin:0;color:var(--ink);opacity:.85;font-size:clamp(11px,1.5vw,14px);text-align:center;text-shadow:1px 1px 0 #000}
.worlds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.4%;width:100%;margin-top:1%}
.portal{position:relative;background:var(--w-bg);border:3px solid var(--w-edge);border-radius:6px;color:var(--w-ink);text-align:left;padding:8% 8% 10%;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 5px 0 #0009;transition:transform .12s}
.portal:hover,.portal:focus-visible{transform:translateY(-4px)}
.portal .no{font-size:clamp(10px,1.2vw,12px);opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.portal .nm{font-size:clamp(12px,1.75vw,19px);font-weight:700;line-height:1.05}
.portal .mode{font-family:var(--f-body);font-size:clamp(10px,1.2vw,12.5px);line-height:1.25;opacity:.92}
.portal .stars{font-size:clamp(11px,1.6vw,17px);letter-spacing:.12em;margin-top:auto}
.portal canvas{position:relative;width:100%;height:auto;aspect-ratio:4/3;border-radius:3px;image-rendering:pixelated;background:#0003}
.menu .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:1.5%}


/* Carte des mondes */
.mapov{align-items:flex-end;pointer-events:none;padding:2%}
.mapbar{pointer-events:auto;width:100%;background:#14121fe6;border:3px solid var(--line);border-radius:8px;padding:clamp(8px,1.4vw,14px);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mapinfo{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 280px}
.mapinfo .no{font-family:var(--f-display);color:var(--coin);font-size:clamp(11px,1.4vw,14px);letter-spacing:.06em}
.mapinfo .nm{font-family:var(--f-display);font-size:clamp(15px,2.2vw,22px);font-weight:700}
.mapinfo .ds{font-size:clamp(11px,1.4vw,14px);color:var(--ink);opacity:.9;line-height:1.3}
.mapbtns{display:flex;gap:6px;flex-wrap:wrap}
.mapbtns .btn{font-size:clamp(12px,1.4vw,15px);padding:6px 11px}
@media (max-width:640px){ .mapinfo .ds{display:none} }

/* Quiz */
.card{background:var(--panel);border:3px solid var(--q-edge,var(--coin));border-radius:8px;width:min(720px,100%);max-height:100%;overflow:auto;padding:clamp(12px,2.4vw,24px);box-shadow:0 8px 0 #000a;display:flex;flex-direction:column;gap:12px}
.card .kick{font-family:var(--f-display);color:var(--q-edge,var(--coin));font-size:clamp(11px,1.4vw,14px);letter-spacing:.08em;text-transform:uppercase}
.card .q{font-size:clamp(14px,2vw,20px);line-height:1.35;font-weight:700;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font-family:var(--f-body);font-size:clamp(12.5px,1.6vw,16px);text-align:left;background:var(--cab2);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:10px 12px;line-height:1.3;font-weight:400}
.opt b{font-family:var(--f-display);color:var(--coin);margin-right:6px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:#173b2c}
.opt.wrong{border-color:var(--hit);background:#4a1b26}
.opt[disabled]{cursor:default}
.expl{border-left:4px solid var(--ok);padding:6px 12px;background:#0003;font-size:clamp(12.5px,1.6vw,15.5px);line-height:1.4}
.expl.bad{border-left-color:var(--hit)}
.card .actions{display:flex;justify-content:flex-end;gap:8px}

/* Codex */
.codex{flex-direction:column;justify-content:flex-start;background:#0b0914f2;overflow:auto;gap:10px}
.codex .head{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;flex-wrap:wrap}
.codex h2{font-family:var(--f-display);margin:0;font-size:clamp(16px,2.4vw,24px)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.tab{font-family:var(--f-display);background:var(--cab2);color:var(--dim);border:2px solid var(--line);border-radius:4px;padding:4px 10px;font-size:13px}
.tab[aria-selected="true"]{color:#14121f;background:var(--t-c,var(--coin));border-color:var(--t-c,var(--coin))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;width:100%}
.note{background:var(--panel);border:2px solid var(--line);border-top:5px solid var(--t-c,var(--coin));border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.42;min-width:0}
.note h3{font-family:var(--f-display);font-size:16px;margin:0 0 4px}
.note p{margin:0}
.note .f{font-family:"Courier New",monospace;background:#0004;padding:1px 5px;border-radius:3px;white-space:nowrap}
.note.locked{opacity:.45;border-top-color:var(--line)}

/* Atelier (analyse technologique) */
.atelier{z-index:4;background:#1b2230;align-items:stretch;justify-content:stretch;padding:0;font-family:var(--f-body)}
.at-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;width:100%;height:100%}
.at-left{position:relative;background:
  linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/24px 24px,#16324f;border-right:3px solid #0d1b2b;min-width:0}
.at-left canvas{position:absolute;inset:0;width:100%;height:100%}
.at-tag{position:absolute;left:10px;top:44px;font-family:var(--f-display);font-size:clamp(10px,1.3vw,13px);color:#bfe3ff;background:#0d1b2bcc;padding:3px 8px;border-radius:3px}
.at-right{display:flex;flex-direction:column;gap:10px;padding:clamp(10px,2vw,20px);padding-top:clamp(40px,6vw,56px);overflow:auto;background:#eae4d3;color:#1e2633;min-width:0}
.at-right h3{font-family:var(--f-display);margin:0;font-size:clamp(14px,2vw,20px);color:#16324f}
.at-right .step{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:#9b5b00;text-transform:uppercase}
.at-right p{margin:0;line-height:1.4;font-size:clamp(12.5px,1.55vw,15px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-body);font-size:clamp(12px,1.45vw,14.5px);background:#fff;color:#1e2633;border:2px solid #b8ad92;border-radius:999px;padding:5px 12px}
.chip:hover{border-color:#16324f}
.chip.on{background:#16324f;color:#fff;border-color:#16324f}
.chip.right{background:#1f7a4d;color:#fff;border-color:#1f7a4d}
.chip.wrong{background:#b5323f;color:#fff;border-color:#b5323f}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.feedback{font-size:clamp(12px,1.5vw,14.5px);padding:6px 10px;border-radius:4px;background:#fff8;border-left:4px solid #1f7a4d;line-height:1.4}
.feedback.bad{border-left-color:#b5323f}
.ratio{font-family:var(--f-display);font-size:clamp(16px,2.4vw,24px);color:#16324f}
.at-right .btn{align-self:flex-start;background:#16324f;color:#fff;border-color:#0d1b2b}

/* Messages / end screens */
.banner{flex-direction:column;gap:12px;text-align:center;background:#000a}
.banner h2{font-family:var(--f-display);font-size:clamp(22px,4.5vw,46px);margin:0;text-shadow:4px 4px 0 #000}
.banner p{margin:0;max-width:52ch;font-size:clamp(13px,1.8vw,17px);line-height:1.4}

/* Touch pad */
.pad{display:none;justify-content:space-between;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .g{display:flex;gap:10px}
.pad button{width:64px;height:56px;font-size:22px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px}
.pad button.act{width:86px;background:var(--coin);color:#2a1c00;border-color:#b98a10}
.pad button.on{filter:brightness(1.4)}
@media (pointer:coarse){ .pad{display:flex} }
.help{color:var(--dim);font-size:13px;display:flex;gap:18px;flex-wrap:wrap;margin:0}
.help kbd{font-family:var(--f-display);background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;padding:0 6px;color:var(--ink)}

@media (max-width:760px){
  .worlds{grid-template-columns:repeat(3,minmax(0,1fr))}
  .portal .mode{display:none}
  .opts{grid-template-columns:1fr}
  .at-grid{grid-template-columns:1fr;grid-template-rows:42% 58%}
  .at-left{border-right:0;border-bottom:3px solid #0d1b2b}
  .at-right{padding-top:10px}
}
@media (max-width:520px){ .worlds{grid-template-columns:repeat(2,minmax(0,1fr))} .portal canvas{display:none} }
@media (prefers-reduced-motion:reduce){ .portal{transition:none} }
</style>
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>Super Odyssée <span>ST 4</span></h1>
    <p>Science et technologie · 4<sup>e</sup> secondaire · 5 mondes de plateformes</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" width="960" height="540" aria-label="Écran de jeu"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="grp"><span id="hudWorld">—</span><span class="hearts" id="hudHearts">♥♥♥</span></div>
      <div class="grp"><span id="hudScore">✦ 0</span><button class="btn pause" id="btnQuit" type="button">Carte</button></div>
    </div>

    <div class="ov mapov" id="menu">
      <div class="mapbar">
        <div class="mapinfo"><span class="no" id="mapNo"></span><span class="nm" id="mapName"></span><span class="ds" id="mapDesc"></span></div>
        <div class="mapbtns">
          <button class="btn" id="mapPrev" type="button" aria-label="Monde précédent">◀</button>
          <button class="btn gold" id="mapPlay" type="button">Jouer ▸</button>
          <button class="btn" id="mapNext" type="button" aria-label="Monde suivant">▶</button>
          <button class="btn" id="btnCodex" type="button">Carnet de notions</button>
          <button class="btn" id="btnSound" type="button">Son : activé</button>
        </div>
      </div>
    </div>
    <div class="ov" id="quiz" hidden><div class="card" id="quizCard"></div></div>
    <div class="ov codex" id="codex" hidden></div>
    <div class="ov atelier" id="atelier" hidden></div>
    <div class="ov banner" id="banner" hidden></div>
  </div>

  <div class="pad" id="pad">
    <div class="g"><button type="button" data-k="left" aria-label="Gauche">◀</button><button type="button" data-k="right" aria-label="Droite">▶</button></div>
    <div class="g"><button type="button" data-k="up" aria-label="Haut">▲</button><button type="button" data-k="down" aria-label="Bas">▼</button><button type="button" class="act" data-k="fire" aria-label="Lancer" style="width:64px;background:#5ee6a0;border-color:#2aa86d">TIR</button><button type="button" class="act" data-k="jump" aria-label="Saut">SAUT</button></div>
  </div>

  <p class="help"><span><kbd>←</kbd> <kbd>→</kbd> bouger</span><span><kbd>Espace</kbd> / <kbd>↑</kbd> sauter (et nager dans l'eau)</span><span><kbd>X</kbd> lancer une fiole (pouvoir Neutralisant)</span><span><kbd>1</kbd>–<kbd>4</kbd> répondre</span><span><kbd>Échap</kbd> retour à la carte</span></p>
</div>
<script>
// ================= DONNÉES =================
const WORLDS = [
  {id:"mat",   no:"Monde 1", name:"Labo de la Matière",     mode:"Plateformes : frappe les blocs ? par en dessous, saute sur les ions.", bg:"#2b5d8a", edge:"#8fd3ff", ink:"#f2fbff", col:"#8fd3ff"},
  {id:"elec",  no:"Monde 2", name:"Centrale Ampère",        mode:"Course rapide : attrape l'anneau de la bonne réponse. Double saut !", bg:"#3a2a00", edge:"#ffc93c", ink:"#fff6dc", col:"#ffc93c"},
  {id:"terre", no:"Monde 3", name:"Sonde Terre & Espace",   mode:"Plongée libre : de l'espace jusqu'au sol, touche la bonne bulle.", bg:"#103d3a", edge:"#5ee6c8", ink:"#e8fffa", col:"#5ee6c8"},
  {id:"viv",   no:"Monde 4", name:"Forêt trophique",        mode:"Combat RPG au tour par tour contre les menaces de l'écosystème.", bg:"#2f3a12", edge:"#b6e36a", ink:"#f6ffe4", col:"#b6e36a"},
  {id:"tech",  no:"Monde 5", name:"Atelier d'analyse",      mode:"Analyse technologique : mécanismes, rapports de vitesse et fiche d'un étau.", bg:"#4a2412", edge:"#ff9a52", ink:"#fff1e6", col:"#ff9a52"}
];

// q : question · o : choix · a : index de la bonne réponse · e : explication · c : fiche du carnet
const Q = {
mat:[
 {q:"Selon le modèle de Rutherford-Bohr, combien d'électrons le sodium (Z = 11) a-t-il sur sa dernière couche ?",o:["1","2","8","11"],a:0,e:"Répartition 2 – 8 – 1 : il reste 1 électron de valence. C'est pourquoi le sodium est dans le groupe I (alcalins).",c:"atome"},
 {q:"Dans le tableau périodique, que nous indique le numéro de la période d'un élément ?",o:["Le nombre d'électrons de valence","Le nombre de couches électroniques","Le nombre de neutrons","Sa masse atomique"],a:1,e:"Période = nombre de couches électroniques. Groupe = nombre d'électrons de valence.",c:"tableau"},
 {q:"Combien de points dessine-t-on autour du symbole C dans la notation de Lewis du carbone ?",o:["2","4","6","12"],a:1,e:"Le carbone (groupe IV) a 4 électrons de valence, donc 4 points.",c:"atome"},
 {q:"Le chlore gagne un électron pour compléter sa dernière couche. Quel ion forme-t-il ?",o:["Cl⁺","Cl²⁻","Cl⁻","Cl⁷⁺"],a:2,e:"Gagner un électron (négatif) donne une charge de 1−, soit l'ion Cl⁻.",c:"tableau"},
 {q:"On dissout 15 g de sel dans 500 mL d'eau. Quelle est la concentration ?",o:["7,5 g/L","15 g/L","30 g/L","0,03 g/L"],a:2,e:"C = m / V = 15 g ÷ 0,500 L = 30 g/L.",c:"solutions"},
 {q:"Un lac contient 0,004 g de mercure par litre d'eau (1 L ≈ 1 000 000 mg). Quelle est la concentration en ppm ?",o:["0,004 ppm","4 ppm","40 ppm","4000 ppm"],a:1,e:"0,004 g = 4 mg. 4 mg dans 1 000 000 mg d'eau, c'est 4 ppm (4 mg/L).",c:"solutions"},
 {q:"Laquelle de ces substances est un électrolyte une fois dissoute dans l'eau ?",o:["Le sucre","L'éthanol","Le sel de table (NaCl)","L'eau distillée"],a:2,e:"NaCl se dissocie en ions Na⁺ et Cl⁻ qui permettent le passage du courant électrique.",c:"solutions"},
 {q:"Une solution a un pH de 2. Elle est…",o:["Basique","Neutre","Acide","Impossible à classer"],a:2,e:"pH < 7 : acide. pH = 7 : neutre. pH > 7 : basique.",c:"ph"},
 {q:"Que produit une réaction de neutralisation acidobasique ?",o:["Un sel et de l'eau","Un acide plus fort","Du CO₂ et de l'énergie","Un métal et un gaz"],a:0,e:"Acide + base → sel + eau. Ex. : HCl + NaOH → NaCl + H₂O.",c:"ph"},
 {q:"12 g de carbone réagissent complètement avec 32 g de dioxygène. Quelle masse de CO₂ obtient-on ?",o:["20 g","32 g","44 g","12 g"],a:2,e:"Loi de la conservation de la masse : masse des réactifs = masse des produits. 12 + 32 = 44 g.",c:"transfo"},
 {q:"Quels coefficients balancent l'équation : __ H₂ + __ O₂ → __ H₂O ?",o:["1, 1, 1","2, 1, 2","1, 2, 2","2, 2, 1"],a:1,e:"2 H₂ + O₂ → 2 H₂O : 4 H et 2 O de chaque côté.",c:"transfo"},
 {q:"Quels sont les trois éléments du triangle de feu ?",o:["Combustible, comburant, point d'ignition","Bois, eau, oxygène","Chaleur, lumière, fumée","Carbone, azote, hydrogène"],a:0,e:"Sans combustible, sans comburant (souvent O₂) ou sans atteindre le point d'ignition, pas de combustion.",c:"transfo"},
 {q:"Quels sont les produits de la photosynthèse ?",o:["CO₂ et H₂O","Glucose et O₂","Glucose et CO₂","O₂ et H₂O"],a:1,e:"6 CO₂ + 6 H₂O + énergie lumineuse → C₆H₁₂O₆ + 6 O₂. La respiration cellulaire fait l'inverse.",c:"photo"},
 {q:"Quels sont les réactifs de la respiration cellulaire ?",o:["Glucose et O₂","CO₂ et H₂O","Lumière et CO₂","Glucose et CO₂"],a:0,e:"C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + énergie. Elle se produit dans les cellules de presque tous les êtres vivants.",c:"photo"},
 {q:"Une bûche brûle complètement et il ne reste qu'un peu de cendre. La masse a-t-elle disparu ?",o:["Oui, la combustion détruit la matière","Non, elle se retrouve surtout dans les gaz produits (CO₂, vapeur d'eau)","Oui, elle se transforme en énergie","Non, elle reste entièrement dans la cendre"],a:1,e:"Loi de la conservation de la masse : les atomes se réarrangent. En système fermé, la masse des produits égale celle des réactifs.",c:"transfo"},
],
elec:[
 {q:"Un grille-pain branché sur 120 V a une résistance de 12 Ω. Quelle intensité le traverse ?",o:["0,1 A","10 A","1440 A","132 A"],a:1,e:"Loi d'Ohm : I = U / R = 120 V ÷ 12 Ω = 10 A.",c:"ohm"},
 {q:"Deux ampoules sont branchées en série. L'une grille. Que se passe-t-il ?",o:["L'autre brille plus fort","L'autre s'éteint aussi","L'autre reste allumée normalement","Le circuit prend feu"],a:1,e:"En série, il n'y a qu'un seul chemin pour le courant : si un élément brise le circuit, plus rien ne fonctionne.",c:"circuits"},
 {q:"Pourquoi les prises d'une maison sont-elles branchées en parallèle ?",o:["Pour que chaque appareil fonctionne même si un autre est éteint","Pour réduire la tension","Pour économiser du fil","Pour que tous s'éteignent ensemble"],a:0,e:"En parallèle, chaque branche est un chemin distinct : on peut ouvrir une branche sans couper les autres.",c:"circuits"},
 {q:"Comment branche-t-on un ampèremètre pour mesurer l'intensité du courant ?",o:["En série","En parallèle","Hors du circuit","À la place de la pile"],a:0,e:"L'ampèremètre se branche en série (le courant doit le traverser) ; le voltmètre se branche en parallèle aux bornes de l'élément.",c:"ohm"},
 {q:"Une bouilloire fonctionne sous 120 V avec un courant de 10 A. Quelle est sa puissance ?",o:["12 W","130 W","1200 W","0,083 W"],a:2,e:"P = U × I = 120 V × 10 A = 1200 W.",c:"puissance"},
 {q:"Un radiateur de 1500 W fonctionne pendant 2 h. Quelle énergie consomme-t-il ?",o:["750 kWh","3 kWh","1,5 kWh","3000 kWh"],a:1,e:"E = P × Δt = 1,5 kW × 2 h = 3 kWh (ou 1500 W × 7200 s = 10 800 000 J).",c:"puissance"},
 {q:"On frotte un ballon sur ses cheveux et il se charge négativement. Que s'est-il passé ?",o:["Des protons sont passés au ballon","Des électrons sont passés des cheveux au ballon","Le ballon a perdu des électrons","Des neutrons ont été créés"],a:1,e:"En électricité statique, seuls les électrons se déplacent. Le ballon en gagne : il devient négatif.",c:"statique"},
 {q:"Deux objets chargés négativement sont placés l'un près de l'autre. Ils…",o:["S'attirent","Se repoussent","Ne réagissent pas","Deviennent neutres"],a:1,e:"Charges de même signe : répulsion. Charges de signes contraires : attraction.",c:"statique"},
 {q:"Selon la règle de la main droite pour un fil, que représente le pouce ?",o:["Le sens du champ magnétique","Le sens du courant","Le pôle nord","La force"],a:1,e:"Pouce = sens du courant ; les doigts qui s'enroulent montrent le sens des lignes de champ autour du fil.",c:"magnet"},
 {q:"Quelle modification rend un électroaimant (solénoïde) PLUS puissant ?",o:["Diminuer le nombre de spires","Diminuer le courant","Ajouter un noyau de fer","Retirer la pile"],a:2,e:"Plus de spires, plus de courant, ou un noyau ferromagnétique (fer) augmentent le champ du solénoïde.",c:"magnet"},
 {q:"Une ampoule reçoit 100 J d'énergie électrique et émet 15 J de lumière. Quel est son rendement ?",o:["15 %","85 %","115 %","6,7 %"],a:0,e:"Rendement = énergie utile ÷ énergie consommée × 100 = 15 ÷ 100 × 100 = 15 %. Le reste devient chaleur.",c:"energie"},
 {q:"Que dit la loi de la conservation de l'énergie ?",o:["L'énergie se perd avec le temps","L'énergie ne peut être ni créée ni détruite, seulement transformée","Toute énergie finit en électricité","L'énergie se crée par le mouvement"],a:1,e:"L'énergie se transforme ou se transfère ; la quantité totale reste la même.",c:"energie"},
 {q:"Quelle phrase décrit la TEMPÉRATURE (et non la chaleur) ?",o:["Un transfert d'énergie entre deux milieux","La mesure du degré d'agitation des particules","Une quantité en joules qui passe du chaud au froid","Une forme d'énergie électrique"],a:1,e:"Température : degré d'agitation des particules (°C). Chaleur : transfert d'énergie thermique du milieu chaud vers le milieu froid.",c:"energie"},
 {q:"Deux aimants : le pôle nord de l'un approche le pôle sud de l'autre. Ils…",o:["Se repoussent","S'attirent","Tournent sur eux-mêmes","Perdent leur magnétisme"],a:1,e:"Pôles contraires s'attirent, pôles semblables se repoussent. Les lignes de champ vont du N vers le S à l'extérieur de l'aimant.",c:"magnet"}
],
terre:[
 // espace
 {z:0,q:"Quelle est la principale cause des marées sur Terre ?",o:["Les vents dominants","L'attraction gravitationnelle de la Lune","La rotation du Soleil","Les séismes"],a:1,e:"La Lune (et dans une moindre mesure le Soleil) attire les masses d'eau : environ deux marées hautes par jour.",c:"espace"},
 {z:0,q:"Quelle partie de l'énergie solaire réchauffe la Terre et alimente la photosynthèse ?",o:["Seulement les rayons X","Le rayonnement émis par le Soleil (surtout lumière visible et infrarouge)","Le vent solaire uniquement","La gravité du Soleil"],a:1,e:"Le Soleil émet un flux d'énergie, surtout sous forme de lumière visible et d'infrarouge, qui chauffe la Terre et nourrit les producteurs.",c:"espace"},

 {z:1,q:"Que fait l'effet de serre ?",o:["Il détruit la couche d'ozone","Des gaz retiennent une partie de la chaleur émise par la Terre","Il bloque toute la lumière du Soleil","Il cause les marées"],a:1,e:"CO₂, CH₄, vapeur d'eau… absorbent l'infrarouge émis par la Terre. Naturel et utile, mais amplifié par les activités humaines.",c:"atmo"},
 {z:1,q:"Une dépression (cyclone) est associée à…",o:["Une haute pression et du beau temps","Une basse pression, des nuages et des précipitations","Aucun vent","Une masse d'air très sèche immobile"],a:1,e:"Cyclone : basse pression, l'air monte, nuages et précipitations. Anticyclone : haute pression, temps dégagé.",c:"atmo"},
 {z:1,q:"Qu'est-ce qu'une masse d'air ?",o:["Un nuage très dense","Un grand volume d'air de température et d'humidité assez uniformes","Le vent d'une tempête","La couche d'ozone"],a:1,e:"Une masse d'air prend les caractéristiques de la région où elle se forme. Sa rencontre avec une autre forme un front.",c:"atmo"},
 {z:1,q:"Quels facteurs déterminent surtout la répartition des biomes terrestres ?",o:["La température et les précipitations","La couleur du sol","Le nombre d'habitants","La présence de volcans"],a:0,e:"Le climat (température, précipitations), lui-même influencé par la latitude, l'altitude et les courants, détermine les biomes.",c:"biomes"},
 {z:1,q:"Brûler des combustibles fossiles a quel effet sur le cycle du carbone ?",o:["Retire du CO₂ de l'air","Ajoute du CO₂ dans l'atmosphère","Transforme le CO₂ en azote","Aucun effet"],a:1,e:"Le carbone stocké depuis des millions d'années est rejeté sous forme de CO₂, ce qui augmente l'effet de serre.",c:"cycles"},
 // hydrosphère
 {z:2,q:"Qu'est-ce qu'un bassin versant ?",o:["Un lac artificiel","Un territoire dont toutes les eaux s'écoulent vers un même cours d'eau ou plan d'eau","Une zone de la mer très profonde","Un barrage"],a:1,e:"Les lignes de partage des eaux (crêtes) délimitent le bassin. Un polluant en amont peut atteindre tout l'aval.",c:"hydro"},
 {z:2,q:"Quelle est la différence entre un glacier et la banquise ?",o:["Aucune","Le glacier est de l'eau douce sur la terre ferme ; la banquise est de l'eau de mer gelée","La banquise est sur les montagnes","Le glacier flotte sur l'océan"],a:1,e:"La fonte des glaciers fait monter le niveau de la mer ; celle de la banquise, beaucoup moins (elle flotte déjà).",c:"hydro"},
 {z:2,q:"La circulation océanique profonde (thermohaline) dépend surtout de…",o:["La température et la salinité de l'eau","La couleur de l'eau","Les marées seulement","Les poissons"],a:0,e:"Une eau froide et salée est plus dense : elle plonge et met en mouvement les courants profonds. Les courants de surface dépendent surtout des vents.",c:"hydro"},
 {z:2,q:"Quelle ressource énergétique provient de l'hydrosphère ?",o:["Le pétrole des sables bitumineux","L'hydroélectricité","Le charbon","L'énergie éolienne"],a:1,e:"Hydroélectricité, énergie marémotrice et énergie des vagues proviennent de l'hydrosphère.",c:"hydro"},

 {z:3,q:"Quel est l'ordre des horizons d'un sol, de la surface vers le bas ?",o:["C, B, A, O","O, A, B, C","A, O, C, B","B, C, O, A"],a:1,e:"O : litière (matière organique) · A : terre arable · B : sous-sol (accumulation) · C : roche mère fragmentée.",c:"litho"},
 {z:3,q:"Qu'est-ce que le pergélisol ?",o:["Un sol gelé en permanence depuis au moins 2 ans","Un sol très fertile","Une roche volcanique","La couche de neige de l'hiver"],a:0,e:"Son dégel, causé par le réchauffement, libère des gaz à effet de serre et rend les sols instables.",c:"litho"},
 {z:3,q:"Que désigne la capacité tampon d'un sol ?",o:["Sa capacité à absorber l'eau","Sa capacité à neutraliser les acides et à garder un pH stable","Sa dureté","Sa couleur"],a:1,e:"Un sol à bonne capacité tampon résiste mieux aux précipitations acides.",c:"litho"},
 {z:3,q:"Quel rôle jouent certaines bactéries du sol dans le cycle de l'azote ?",o:["Elles détruisent l'azote","Elles fixent l'azote de l'air (N₂) en composés utilisables par les plantes","Elles produisent du CO₂ seulement","Aucun rôle"],a:1,e:"Les plantes ne peuvent pas utiliser le N₂ directement : des bactéries le transforment (ammonium, nitrates).",c:"cycles"},
 {z:3,q:"Pour identifier un minéral, quelle propriété correspond à la couleur de sa poudre ?",o:["L'éclat","La dureté","La trace","La transparence"],a:2,e:"On frotte le minéral sur une plaque de porcelaine : la couleur de la trace peut différer de celle du minéral.",c:"litho"}
],

function mkQ(q, ans, wrongs, unit, e, c, extra){
  const fmtV = v => typeof v === "number" ? `${nf(v)}${unit ? " " + unit : ""}` : v;
  const opts = [fmtV(ans)];
  for (const w of wrongs){ const t = fmtV(w); if (!opts.includes(t) && !(typeof w === "number" && (w <= 0 || !isFinite(w)))) opts.push(t); if (opts.length === 4) break; }
  let k = 2; while (opts.length < 4 && typeof ans === "number"){ const t = fmtV(ans*k + k); if (!opts.includes(t)) opts.push(t); k++; }
  return Object.assign({q, o:opts, a:0, e, c, gen:true}, extra || {});
}

// Sélection renouvelée : questions jamais vues d'abord + questions générées avec de nouveaux nombres
function freshSet(wid, n, filter){
  filter = filter || (() => true);
  const pool = Q[wid].filter(filter);
  SAVE.seen = SAVE.seen || {}; const seen = SAVE.seen[wid] || [];
  const unseen = shuffle(pool.filter(q => !seen.includes(q.q))), old = shuffle(pool.filter(q => seen.includes(q.q)));
  const gens = shuffle((GEN[wid] || []).filter(g => filter({c:g.c, z:g.z})));
  let nGen = gens.length ? Math.min(gens.length*2, Math.round(n*0.4)) : 0;
  const stat = unseen.concat(old).slice(0, n - nGen);
  nGen = n - stat.length;
  const made = []; for (let i=0; i<nGen && gens.length; i++) made.push(gens[i % gens.length].f());
  let s2 = seen.concat(stat.map(q => q.q));
  if (Q[wid].every(q => s2.includes(q.q))) s2 = stat.map(q => q.q);
  SAVE.seen[wid] = [...new Set(s2)]; persist();
  return shuffle(stat.concat(made));
}

const AudioSys = (() => {

  const freq = n => { const m = n.match(/^([A-G]#?)(\d)$/); if(!m) return 0; return 440*Math.pow(2,(NOTES[m[1]] + (+m[2]+1)*12 - 69)/12); };

  function ensure(){

    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return false; }

    return true;
  }
  function tone(f, t, dur, type, vol, slideTo){
    if (!f) return;
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    o.connect(v); v.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  let noiseBuf = null;
  function noise(t, dur, vol, hp){
    if (!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate*0.3, ac.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
    s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = hp;
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(0.0008, t+dur);
    s.connect(f); f.connect(v); v.connect(master); s.start(t); s.stop(t+dur+0.02);
  }
  function tick(){
    if (!song) return;
    const spb = 60 / song.bpm / 2; // croches
    while (nextT < ac.currentTime + 0.12){
      const i = step % song.lead.length;
      const L = song.lead[i], B = song.bass[step % song.bass.length];
      let len = 1; while (song.lead[(i+len) % song.lead.length] === "-" && len < 8) len++;
      if (L !== "." && L !== "-") tone(freq(L), nextT, spb*len*0.9, song.wave, 0.22);
      if (B !== "." && B !== "-") tone(freq(B), nextT, spb*1.6, "triangle", 0.35);
      if (song.drum){ const d = song.drum[step % song.drum.length]; if (d==="k") tone(150, nextT, 0.12, "sine", 0.5, 45); else if (d==="h") noise(nextT, 0.04, 0.12, 7000); else if (d==="s") noise(nextT, 0.12, 0.25, 1500); }
      nextT += spb; step++;
    }
  }
  return {
    unlock(){ if (ensure() && ac.state === "suspended") ac.resume(); },
    play(name){
      if (!ensure()) return;
      const S = SONGS[name]; if (!S) return;
      song = {bpm:S.bpm, wave:S.wave, lead:parse(S.lead), bass:parse(S.bass), drum:S.drum ? parse(S.drum) : null};
      step = 0; nextT = ac.currentTime + 0.05;
      if (!timer) timer = setInterval(tick, 40);
    },
    stop(){ song = null; },
    setOn(on){ SAVE.sound = on; persist(); if (master) master.gain.value = on ? 0.18 : 0; },
    sfx(kind){
      if (!ac || !SAVE.sound) return; const t = ac.currentTime;
      if (kind==="jump") tone(320, t, 0.14, "square", 0.18, 640);
      else if (kind==="coin"){ tone(988, t, 0.07, "square", 0.2); tone(1319, t+0.07, 0.22, "square", 0.2); }
      else if (kind==="good"){ [523,659,784,1047].forEach((f,i)=>tone(f, t+i*0.07, 0.16, "square", 0.18)); }
      else if (kind==="bad"){ tone(300, t, 0.18, "sawtooth", 0.2, 120); tone(200, t+0.16, 0.3, "sawtooth", 0.2, 80); }
      else if (kind==="hit"){ noise(t, 0.18, 0.4, 500); tone(180, t, 0.2, "square", 0.2, 60); }
      else if (kind==="stomp"){ tone(500, t, 0.1, "square", 0.2, 150); }
      else if (kind==="bump"){ tone(140, t, 0.08, "square", 0.25, 90); }
      else if (kind==="win"){ [523,659,784,659,784,1047].forEach((f,i)=>tone(f, t+i*0.12, 0.2, "square", 0.2)); }
      else if (kind==="click"){ noise(t, 0.03, 0.2, 3000); }
    }
  };
})();

function wrapText(text, x, y, maxW, lh, align){
  const words = text.split(" "); let line = "", lines = [];
  for (const w of words){ const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  g.textAlign = align || "left";
  lines.forEach((l,i) => g.fillText(l, x, y + i*lh));
  return lines.length;
}
function px(x,y,w,h,c){ g.fillStyle = c; g.fillRect(Math.round(x),Math.round(y),w,h); }

// ---------- Quiz (modal commun) ----------
let quizState = null;
function ask(worldId, q, done, opts){
  opts = opts || {};
  const w = worldById(worldId);
  const order = shuffle(q.o.map((t,i)=>({t,i})));
  quizState = {q, order, done, answered:false, worldId};
  const card = $("quizCard");
  card.style.setProperty("--q-edge", w.col);
  card.innerHTML = `<div class="kick">${opts.kicker || w.name}</div><p class="q">${q.q}</p>
    <div class="opts">${order.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><b>${k+1}</b>${o.t}</button>`).join("")}</div>
    <div id="qExpl"></div><div class="actions" id="qAct"></div>`;
  card.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(+b.dataset.k)));
  $("quiz").hidden = false; paused = true;
  card.querySelector(".opt").focus({preventScroll:true});
}
function answer(k){
  const s = quizState; if (!s || s.answered) return;
  s.answered = true;
  const ok = s.order[k].i === s.q.a;
  const btns = $("quizCard").querySelectorAll(".opt");
  btns.forEach((b,j) => { b.disabled = true; if (s.order[j].i === s.q.a) b.classList.add("right"); else if (j===k) b.classList.add("wrong"); });
  if (ok){ AudioSys.sfx("good"); unlockCard(s.q.c); } else AudioSys.sfx("bad");
  $("qExpl").innerHTML = `<div class="expl ${ok?"":"bad"}"><b>${ok ? "Bonne réponse !" : "Pas tout à fait."}</b> ${s.q.e}</div>`;
  $("qAct").innerHTML = `<button type="button" class="btn gold" id="qGo">Continuer ▸</button>`;
  $("qGo").addEventListener("click", closeQuiz); $("qGo").focus({preventScroll:true});
  s.ok = ok;
}
function closeQuiz(){
  const s = quizState; if (!s || !s.answered) return;
  $("quiz").hidden = true; paused = false; quizState = null;
  for (const k in keys) keys[k] = false;
  s.done(s.ok);
}
function quizKey(e){
  if (!quizState) return;
  if (!quizState.answered && /^Digit[1-4]$/.test(e.code)){ const n = +e.code.slice(5)-1; if (n < quizState.order.length) answer(n); }
  else if (quizState.answered && (e.code==="Enter" || e.code==="Space")){ e.preventDefault(); closeQuiz(); }
}

// ---------- Construction d'un niveau (nouvel ordre à chaque partie) ----------
function buildLevel(wid){
  const list = [{rows:SEG_START, z:0}];
  if (wid === "terre"){
    for (let z=0; z<4; z++) shuffle(SEG_COMMON).slice(0, 2).forEach(r => list.push({rows:r, z}));
  } else {
    const picks = shuffle(SEG_COMMON).slice(0, 6).concat(SEG_SPECIAL[wid] || []);
    shuffle(picks).forEach(r => list.push({rows:r, z:0}));
  }
  const lastZ = wid === "terre" ? 3 : 0;
  if (wid === "tech") list.push({rows:SEG_DOOR, z:0, door:true});
  else { list.push({rows:SEG_GATE, z:lastZ, gate:true}); list.push({rows:SEG_ARENA, z:lastZ, arena:true}); }
  const map = []; for (let r=0;r<14;r++) map.push([]);
  const zoneCol = [], spawns = [], coins = []; let gateCol = -1, arenaCol = -1;
  for (const seg of list){
    const w = Math.max(...seg.rows.map(r => r.length)), c0 = map[0].length;
    if (seg.gate) gateCol = c0; if (seg.arena) arenaCol = c0;
    const rows = Array(4).fill(" ".repeat(w)).concat(seg.rows.map(r => r.padEnd(w, " ")));
    rows.forEach((row, r) => { for (let i=0;i<w;i++){
      let ch = row[i];
      if ("efs".includes(ch)){ spawns.push({type:ch, c:c0+i, r}); ch = " "; }
      else if (ch === "o"){ coins.push({x:(c0+i)*40+20, y:r*40+20, on:true}); ch = " "; }
      map[r].push(ch);
    }});
    for (let i=0;i<w;i++) zoneCol.push(seg.z);
  }
  return {map, COLS:map[0].length, zoneCol, spawns, coins, gateCol, arenaCol};
}

  const coins = L.coins;
  const p = {x:2*TS, y:9*TS, w:24, h:46, vx:0, vy:0, on:false, face:1, inv:0, tier:0, safeX:2*TS, conv:0, swim:false, prevB:0};
  let cam = 0, hearts = 3, nCoins = 0, score = 0, right = 0, asked = 0, done = false, msg = null, used = {};
  let bumps = [], pops = [], items = [], flasks = [], bproj = [], debris = [];

  // ----- collisions -----
  function collideX(){
    const top = Math.floor(p.y/TS), bot = Math.floor((p.y+p.h-1)/TS);

    else if (p.vx + p.conv < 0){ const c = Math.floor(p.x/TS); for (let r=top;r<=bot;r++) if (solid(tile(c,r))){ p.x = (c+1)*TS + 0.01; p.vx = Math.max(0, p.vx); } }
  }
  function collideY(){
    const l = Math.floor(p.x/TS), rr = Math.floor((p.x+p.w-1)/TS);
    p.on = false; p.conv = 0;
    if (p.vy >= 0){
      const r = Math.floor((p.y+p.h)/TS);
      for (let c=l;c<=rr;c++){ const ch = tile(c,r);
        if (solid(ch) || (ch === "-" && p.prevB <= r*TS + 1)){
          p.y = r*TS - p.h; p.vy = 0; p.on = true;
          const under = tile(Math.floor((p.x+p.w/2)/TS), r);

        } }

      if (hitC >= 0){ p.y = (r+1)*TS; p.vy = 0; hitBlock(hitC, r); }
    }
  }

  const solidPx = (x, y) => solid(tile(Math.floor(x/TS), Math.floor(y/TS))) || false;

  function hitBlock(c, r){
    const ch = tile(c,r); bumps.push({c, r, t:0.18});

      // héros
      const hx = p.x + p.w/2 - cam;
      if (p.tier >= 1 && !(p.inv > 0 && Math.floor(T*20)%2)){ g.strokeStyle = p.tier === 2 ? TH.item : "#bfe3ff"; g.globalAlpha = 0.5 + Math.sin(T*6)*0.2; g.lineWidth = 3; g.beginPath(); g.ellipse(hx, p.y + 22, 26, 32, 0, 0, 7); g.stroke(); g.globalAlpha = 1; }
      drawHero(hx, p.y - 2, p.face, T, {run: Math.abs(p.vx) > 20 && p.on, air: !p.on, blink: p.inv > 0, coat: p.tier === 2 ? TH.item : "#ffffff"});
      for (const f of flasks) drawFlask(f.x - cam, f.y, TH.item, 0.8);
      for (const b of pops){ g.fillStyle = b.txt === "✗" || b.txt === "Aucun effet !" ? "#ff5d6c" : "#ffc93c"; font(20); g.textAlign = "center"; g.fillText(b.txt, b.x - cam, b.y - (1-b.t)*40); }
      if (msg){ g.font = `700 17px "Atkinson Hyperlegible", sans-serif`; const lines = []; let line = ""; for (const w of msg.txt.split(" ")){ const t2 = line ? line + " " + w : w; if (g.measureText(t2).width > 620 && line){ lines.push(line); line = w; } else line = t2; } lines.push(line); const hh = 18 + lines.length*22; g.fillStyle = "#000c"; g.fillRect(W/2-330, 92, 660, hh); g.fillStyle = "#fff"; g.textAlign = "center"; lines.forEach((l,i) => g.fillText(l, W/2, 114 + i*22)); }
    }
  };
}

// ================= CARTE DES MONDES =================
const NODES = [{x:130,y:400},{x:300,y:255},{x:480,y:380},{x:660,y:235},{x:835,y:370}];
let mapSel = clamp(SAVE.node || 0, 0, 4), mapPos = {x:NODES[mapSel].x, y:NODES[mapSel].y}, mapMoving = false;
function mapPanel(){
  const w = WORLDS[mapSel], st = SAVE.stars[w.id] || 0;
  $("mapNo").textContent = `${w.no} · ${"★".repeat(st)}${"☆".repeat(3-st)}`;
  $("mapName").textContent = THEMES[w.id].name; $("mapName").style.color = w.col;
  $("mapDesc").textContent = MAPINFO[w.id];
}
function mapGo(i){ i = clamp(i, 0, 4); if (i === mapSel) return; mapSel = i; SAVE.node = i; persist(); mapMoving = true; AudioSys.sfx("click"); mapPanel(); }
function drawIcon(i, x, y){
  if (i === 0){ g.fillStyle = "#cfe7f5"; g.beginPath(); g.moveTo(x-6,y-34); g.lineTo(x+6,y-34); g.lineTo(x+6,y-20); g.lineTo(x+20,y); g.lineTo(x-20,y); g.lineTo(x-6,y-20); g.fill(); g.fillStyle = "#5ee6a0"; g.beginPath(); g.moveTo(x-12,y-10); g.lineTo(x+12,y-10); g.lineTo(x+18,y-2); g.lineTo(x-18,y-2); g.fill(); }
  else if (i === 1){ g.fillStyle = "#ffc93c"; g.beginPath(); g.moveTo(x+6,y-40); g.lineTo(x-12,y-14); g.lineTo(x-1,y-14); g.lineTo(x-8,y+2); g.lineTo(x+14,y-24); g.lineTo(x+3,y-24); g.closePath(); g.fill(); }
  else if (i === 2){ g.fillStyle = "#2b6fb0"; g.beginPath(); g.arc(x, y-18, 18, 0, 7); g.fill(); g.fillStyle = "#4f9a3a"; g.beginPath(); g.arc(x-6, y-24, 7, 0, 7); g.arc(x+7, y-12, 6, 0, 7); g.fill(); g.strokeStyle = "#e8eef2"; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y-18, 28, 7, -0.3, 0, 7); g.stroke(); }
  else if (i === 3){ px(x-3, y-12, 6, 12, "#5a3a1a"); g.fillStyle = "#2f5a1e"; g.beginPath(); g.moveTo(x-18,y-10); g.lineTo(x,y-44); g.lineTo(x+18,y-10); g.fill(); }
  else { g.save(); g.translate(x, y-18); g.rotate(T*0.8); g.fillStyle = "#ff9a52"; for (let k=0;k<8;k++){ g.save(); g.rotate(k/8*Math.PI*2); g.fillRect(-4,-22,8,8); g.restore(); } g.beginPath(); g.arc(0,0,16,0,7); g.fill(); g.fillStyle = "#16324f"; g.beginPath(); g.arc(0,0,6,0,7); g.fill(); g.restore(); }
}
const MenuScene = {
  enter(){ $("menu").hidden = false; hud(false); AudioSys.play("menu"); mapPanel(); mapPos = {x:NODES[mapSel].x, y:NODES[mapSel].y}; mapMoving = false; },
  update(dt){
    const tg = NODES[mapSel];
    if (mapMoving){ const dx = tg.x - mapPos.x, dy = tg.y - mapPos.y, d = Math.hypot(dx,dy); if (d < 6){ mapPos = {x:tg.x, y:tg.y}; mapMoving = false; } else { mapPos.x += dx/d*360*dt; mapPos.y += dy/d*360*dt; } return; }
    if (consume("left") || consume("up")) mapGo(mapSel - 1);
    else if (consume("right") || consume("down")) mapGo(mapSel + 1);
    else if (consume("jump")) startWorld(WORLDS[mapSel].id);
  },
  onClick(x, y){ const i = NODES.findIndex(n => Math.hypot(n.x - x, n.y - 20 - y) < 50); if (i < 0) return; if (i === mapSel && !mapMoving) startWorld(WORLDS[i].id); else mapGo(i); },
  draw(){
    const gr = g.createLinearGradient(0,0,0,H); gr.addColorStop(0,"#3a8fd0"); gr.addColorStop(1,"#1f5f9a"); g.fillStyle = gr; g.fillRect(0,0,W,H);
    g.strokeStyle = "#ffffff30"; g.lineWidth = 2; for (let i=0;i<26;i++){ const wx = (i*137 + T*12) % (W+60) - 30, wy = (i*71) % H; g.beginPath(); g.moveTo(wx, wy); g.quadraticCurveTo(wx+10, wy-5, wx+20, wy); g.stroke(); }
    const isl = (cx, cy, rx, ry) => { g.fillStyle = "#f0d9a0"; g.beginPath(); g.ellipse(cx, cy, rx+14, ry+12, 0, 0, 7); g.fill(); g.fillStyle = "#5fae46"; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, 7); g.fill(); g.fillStyle = "#4f9a3a"; for (let k=0;k<6;k++){ g.beginPath(); g.arc(cx - rx*0.6 + k*rx*0.24, cy + Math.sin(k*2)*ry*0.4, 8, 0, 7); g.fill(); } };
    isl(220, 340, 200, 120); isl(560, 320, 200, 130); isl(820, 330, 140, 110);
    for (let i=0;i<4;i++){ const a = NODES[i], b = NODES[i+1]; g.strokeStyle = "#fff6dc"; g.lineWidth = 6; g.setLineDash([2, 14]); g.lineCap = "round"; g.beginPath(); g.moveTo(a.x, a.y); g.quadraticCurveTo((a.x+b.x)/2, Math.min(a.y,b.y) - 40, b.x, b.y); g.stroke(); g.setLineDash([]); g.lineCap = "butt"; }
    for (let i=0;i<5;i++){ const n = NODES[i], w = WORLDS[i], st = SAVE.stars[w.id] || 0;
      g.fillStyle = "#00000040"; g.beginPath(); g.ellipse(n.x, n.y+6, 34, 12, 0, 0, 7); g.fill();
      g.fillStyle = w.col; g.beginPath(); g.ellipse(n.x, n.y, 32, 12, 0, 0, 7); g.fill(); g.fillStyle = "#ffffff55"; g.beginPath(); g.ellipse(n.x, n.y-3, 22, 6, 0, 0, 7); g.fill();
      if (i === mapSel){ g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.ellipse(n.x, n.y, 38 + Math.sin(T*5)*3, 15 + Math.sin(T*5), 0, 0, 7); g.stroke(); }
      drawIcon(i, n.x + 34, n.y - 2);
      g.fillStyle = "#1a1424"; font(15); g.textAlign = "center"; g.fillText(String(i+1), n.x, n.y + 5);
      g.fillStyle = "#ffc93c"; font(16); g.fillText("★".repeat(st) + "☆".repeat(3-st), n.x, n.y + 34); }
    drawHero(mapPos.x, mapPos.y - 50 - Math.abs(Math.sin(T*(mapMoving?10:3)))*(mapMoving?6:3), NODES[mapSel].x >= mapPos.x ? 1 : -1, T, {run:mapMoving});
    g.fillStyle = "#ffffff"; font(30); g.textAlign = "center"; g.fillText("Choisis ton monde", W/2, 52); g.fillStyle = "#1a1424"; g.globalAlpha = 0.3; g.fillText("Choisis ton monde", W/2+3, 55); g.globalAlpha = 1;
    for (let i=0;i<4;i++){ const cx = ((i*300 + T*15) % (W+200)) - 100, cy = 100 + (i%2)*30; g.fillStyle = "#ffffffcc"; g.beginPath(); g.arc(cx,cy,18,0,7); g.arc(cx+20,cy-6,22,0,7); g.arc(cx+42,cy,16,0,7); g.fill(); }
  }
};
$("mapPrev").addEventListener("click", () => { AudioSys.unlock(); mapGo(mapSel - 1); });
$("mapNext").addEventListener("click", () => { AudioSys.unlock(); mapGo(mapSel + 1); });
$("mapPlay").addEventListener("click", () => { AudioSys.unlock(); startWorld(WORLDS[mapSel].id); });
// ================= DÉMARRAGE =================
$("btnCodex").addEventListener("click", () => openCodex());
const sb = $("btnSound");
const syncSound = () => sb.textContent = "Son : " + (SAVE.sound ? "activé" : "coupé");
sb.addEventListener("click", () => { AudioSys.unlock(); AudioSys.setOn(!SAVE.sound); syncSound(); if (SAVE.sound && scene === MenuScene) AudioSys.play("menu"); });
syncSound();
go(MenuScene);
requestAnimationFrame(loop);
</script>
